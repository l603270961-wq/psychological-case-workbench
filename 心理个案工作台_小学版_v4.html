  confirmExport(audience, content, student) {
    const audLabels = { teacher: '班主任版', parent: '家长版', superior: '学校上级版', peer: '专业同行版' };
    const audLabel = audLabels[audience] || audience;
    const now = new Date();
    const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    const defaultFn = `${student.alias}_${audLabel}_${dateStr}`;
    const html = `
      <div class="modal modal-confirm" style="width:460px;">
        <div class="modal-header"><span class="modal-title">导出确认</span><span class="modal-close" data-close>&times;</span></div>
        <div class="modal-body">
          <div class="input-group"><label>文件名</label><input type="text" id="efn" value="${escapeHtml(defaultFn)}" style="font-family:var(--font-mono);font-size:12.5px;"></div>
          <div class="input-group"><label>格式</label><div style="display:flex;gap:14px;padding:4px 0;">
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;"><input type="radio" name="efmt" value="md" checked> Markdown</label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;"><input type="radio" name="efmt" value="pdf"> PDF</label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;"><input type="radio" name="efmt" value="doc"> Word</label>
          </div></div>
          <p style="font-size:13px;line-height:1.7;color:var(--color-text-main);margin:12px 0 6px;">默认使用化名「${escapeHtml(student.alias)}」。是否替换为真名后导出?</p>
          <p style="font-size:11.5px;color:var(--color-text-muted);line-height:1.6;">真名版涉及学生隐私，请仅在确实需要的场景使用。</p>
        </div>
        <div class="modal-footer"><button class="btn btn-ghost" data-close>取消</button><button class="btn btn-secondary" id="ea">导出脱敏版</button><button class="btn btn-danger" id="er">导出真名版</button></div>
      </div>`;
    this.closeModal(); this.openModal(html);
    // 检查该学生是否有真名映射，没有则禁用"导出真名版"按钮
    const hasRealName = !!(this.state.nameMap && this.state.nameMap[student.id]);
    const erBtn = $('#er');
    if (!hasRealName) {
      erBtn.disabled = true;
      erBtn.style.opacity = '0.4';
      erBtn.style.cursor = 'not-allowed';
      erBtn.title = '该学生未录入真名（在「编辑档案」中可补填）';
    }
    const doExport = async (useReal) => {
      const fn = $('#efn').value.trim() || defaultFn;
      const fmt = ($$('input[name="efmt"]').find(r => r.checked) || {}).value || 'md';
      const extMap = { md:'.md', pdf:'.pdf', doc:'.doc' };
      const mimeMap = { md:'text/markdown;charset=utf-8', pdf:'application/pdf', doc:'application/msword' };
      // content 现在是 HTML body 字符串（来自 contenteditable）
      let html = content;
      if (useReal) {
        if (!this.isNameUnlocked()) return showToast('真名导出需先在顶部解锁真名', 'error');
        const rn = this.state.nameMap[student.id];
        if (!rn) return showToast('未找到该学生的真名映射', 'error');
        // 化名是连续中文字符串，HTML 标签里不会出现，直接字符串替换是安全的
        html = content.split(student.alias).join(rn);
      }
      const fullFn = fn + extMap[fmt];
      try {
        if (fmt === 'md') {
          const md = htmlToSimpleMarkdown(html);
          await this.saveOrDownload(md, fullFn, mimeMap[fmt]);
        } else if (fmt === 'pdf') {
          await this.exportPDF(html, fullFn, audience);
        } else if (fmt === 'doc') {
          await this.saveOrDownload(this.generateWordHTML(html, audience), fullFn, mimeMap[fmt]);
        }
        this.closeModal();
        showToast(`已导出${useReal?'真名版':'脱敏版'} (${fmt.toUpperCase()})`, 'success');
      } catch (e) { console.error(e); showToast('导出失败: '+e.message, 'error'); }
    };
    $('#ea').onclick = () => doExport(false);
    $('#er').onclick = () => doExport(true);
  },

    renderExportError(msg) {
    $('#export-body').innerHTML = `<div class="empty-state"><div style="color:var(--warn-deep);">${escapeHtml(msg)}</div></div>`;

  /* 输入：已渲染 HTML body（来自 renderMarkdown 或 contenteditable），以及 audience。
     注意外层 style 属性用双引号包围，内部字体名用 &quot; 转义避免冲突。 */
  generateWordHTML(htmlBody, audience) {
    const styled = applyExportStyles(htmlBody || '', audience);
    const ff = EXPORT_FF;
    return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]--><style>@page{margin:2.54cm 2.54cm;}body{font-family:${ff};font-size:11pt;line-height:1.9;color:#1A2A33;}p,li,h1,h2,h3{font-family:${ff};}</style></head><body style="font-family:${ff};font-size:11pt;line-height:1.9;color:#1A2A33;">${styled}</body></html>`;
  },

  async exportPDF(htmlBody, filename, audience) {
    if (typeof html2pdf === 'undefined') { showToast('PDF 组件加载失败，请刷新后重试', 'error'); return; }
    const styled = applyExportStyles(htmlBody || '', audience);
    const div = document.createElement('div');
    // PDF 用的 wrapper：固定 A4 内容宽度，给 html2canvas 一个稳定的渲染目标
    div.style.cssText = 'padding:32px 36px;font-family:"Microsoft YaHei","Noto Sans SC","SimSun",sans-serif;font-size:11pt;line-height:1.9;color:#1A2A33;width:680px;background:#fff;';
    div.innerHTML = styled;
    document.body.appendChild(div);
    try {
      const opt = { margin: [10,10,10,10], filename, image: { type:'jpeg', quality:0.98 }, html2canvas: { scale:2, useCORS:true, logging:false }, jsPDF: { unit:'mm', format:'a4', orientation:'portrait' } };
      if (window.showSaveFilePicker) { const blob = await html2pdf().set(opt).from(div).outputPdf('blob'); await this.saveOrDownload(blob, filename, 'application/pdf'); }
      else { await html2pdf().set(opt).from(div).save(); }
    } finally { document.body.removeChild(div); }
  },

  async saveOrDownload(content, filename, mimeType) {
    if (window.showSaveFilePicker) {
      try {
        const ext = '.' + filename.split('.').pop();
        const handle = await window.showSaveFilePicker({ suggestedName: filename, types:[{ description:'Document', accept:{ [mimeType||'application/octet-stream']:[ext] } }] });
        const w = await handle.createWritable(); await w.write(content instanceof Blob ? content : content); await w.close();
        return;
      } catch (e) { if (e.name === 'AbortError') return; }
    }
    const blob = content instanceof Blob ? content : new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  },

  async handleImportFile(file) {
    if (file.size > 2*1024*1024) return showToast('文件不能超过 2MB', 'error');
    const body = $('#import-body');
    body.innerHTML = '<div class="empty-state"><div class="loading-spinner"></div><div style="margin-top:10px;">正在读取文件...</div></div>';
    let text = '';
    try {
      const ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'txt' || ext === 'md') {
        text = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file, 'UTF-8'); });
      } else if (ext === 'docx') {
        if (typeof mammoth === 'undefined') { body.innerHTML = '<div class="empty-state"><div style="color:var(--warn-deep);">Word 解析组件未加载，请刷新后重试</div></div>'; return; }
        const ab = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsArrayBuffer(file); });
        const result = await mammoth.extractRawText({ arrayBuffer: ab });
        text = result.value;
      } else {
        body.innerHTML = '<div class="empty-state"><div style="color:var(--warn-deep);">不支持的文件格式。请使用 .txt / .md / .docx</div></div>'; return;
      }
    } catch (e) {
      body.innerHTML = `<div class="empty-state"><div style="color:var(--warn-deep);">文件读取失败: ${escapeHtml(e.message)}</div></div>`; return;
    }
    if (!text.trim()) { body.innerHTML = '<div class="empty-state"><div style="color:var(--warn-deep);">文件内容为空</div></div>'; return; }
    if (!this.state.apiKey) { this.closeModal(); return this.openApiSetupModal(); }
    body.innerHTML = '<div class="empty-state"><div class="loading-spinner"></div><div style="margin-top:10px;">AI 正在解析文件内容...</div></div>';
    try {
      const result = await API.call(PROMPTS.import_legacy, text.slice(0, 15000), this.state.apiKey, true);
      this._importParsed = result;
      this.renderImportPreview(result);
    } catch (e) {
      body.innerHTML = `<div class="empty-state"><div style="color:var(--warn-deep);">AI 解析失败: ${escapeHtml(e.message)}</div><button class="btn btn-ghost" onclick="App.openImportModal()" style="margin-top:10px;">重试</button></div>`;
    }
  },

  async confirmImport() {
    const data = this._importParsed;
    if (!data) return;
    const id = uid('student');
    const alias = data.alias_suggestion || '学生·未命名';
    const s = {
      id, alias,
      basic_info: { class: data.basic_info?.class || '', gender: data.basic_info?.gender || '', age: data.basic_info?.age || null, referral_source: data.basic_info?.referral_source || '' },
      family_background: { structure: data.family_background?.structure || '', primary_caregiver: data.family_background?.primary_caregiver || '', events: data.family_background?.events || '' },
      initial_assessment: data.initial_assessment || '',
      observations: (data.observations || []).map(o => ({ id: uid('obs'), date: o.date ? new Date(o.date).toISOString() : new Date().toISOString(), raw_text: o.raw_text || '', ai_original: o.ai_narrative || o.ai_tags ? { narrative: o.ai_narrative || {}, tags: o.ai_tags || {} } : null, teacher_final: o.ai_narrative ? { narrative: o.ai_narrative || {}, tags: { behavior_categories: o.ai_tags?.behavior_categories || [], emotion_intensity: o.ai_tags?.emotion_intensity || null, risk_level: o.ai_tags?.risk_level || '一般关注', need_family_school_communication: o.ai_tags?.need_family_school_communication || false } } : null, confirmed: true })),

  /* 同名学生冲突解决弹窗 */
  openImportConflictModal(payload, conflicts) {
    const html = `
      <div class="modal modal-confirm" style="width:600px;max-height:80vh;">

            检测到备份文件里的以下学生化名,跟你当前的档案重名。请逐个选择处理方式:
          </p>
          ${conflicts.map((c, i) => {
            const current = this.state.students.find(s => s.alias === c.alias);
            const currentObs = (current.observations || []).length;
            const backupObs = (c.observations || []).length;
            return `
              <div class="conflict-item" style="border:1px solid var(--color-border);border-radius:6px;padding:12px;margin-bottom:10px;">
                <div style="font-size:13px;font-weight:500;color:var(--color-text-main);margin-bottom:8px;">${escapeHtml(c.alias)}</div>
                <div style="font-size:12px;color:var(--color-text-sub);margin-bottom:10px;line-height:1.7;">
                  当前: ${escapeHtml(current.basic_info?.class || '未填班级')} · ${currentObs} 条观察<br>
                  备份: ${escapeHtml(c.basic_info?.class || '未填班级')} · ${backupObs} 条观察
                </div>
                <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;">
                  <label style="cursor:pointer;display:flex;align-items:flex-start;gap:6px;"><input type="radio" name="conflict-${i}" value="merge" checked style="margin-top:3px;"><span><strong>合并</strong> · 观察记录按时间排序合并,同时间戳两条都保留</span></label>
                  <label style="cursor:pointer;display:flex;align-items:flex-start;gap:6px;"><input type="radio" name="conflict-${i}" value="rename" style="margin-top:3px;"><span><strong>保留为独立学生</strong> · 自动改名为"${escapeHtml(c.alias)}(导入)"</span></label>
                  <label style="cursor:pointer;display:flex;align-items:flex-start;gap:6px;"><input type="radio" name="conflict-${i}" value="skip" style="margin-top:3px;"><span><strong>跳过</strong> · 不导入这个学生</span></label>
                </div>
              </div>`;
          }).join('')}
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" data-close>取消</button>
          <button class="btn btn-primary" id="do-conflict-confirm">确认并导入</button>
        </div>
      </div>`;
    this.openModal(html);
    $('#do-conflict-confirm').onclick = () => {
      const decisions = {};
      conflicts.forEach((c, i) => {
        const checked = document.querySelector(`input[name="conflict-${i}"]:checked`);
        decisions[c.alias] = checked ? checked.value : 'merge';
      });
      this.doAutoBackupThenImport(payload, decisions);
    };
  },

  /* 导入前自动备份当前数据 + 执行导入 */
  async doAutoBackupThenImport(payload, conflictDecisions) {
    // Step 1: 自动备份当前数据
    if (this.state.students.length) {
      try {
        const currentPayload = {
          students: this.state.students,
          name_map: this.state.nameMap || {},
          exported_at: new Date().toISOString()
        };
        const encrypted = await Crypto.encrypt(JSON.stringify(currentPayload), this.state.masterPassword);
        const file = { format: 'pgw-backup-v1', encrypted_at: currentPayload.exported_at, encrypted };
        const json = JSON.stringify(file, null, 2);
        const blob = new Blob([json], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const d = new Date();
        const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        a.download = `导入前自动备份_${dateStr}.dat`;
        a.href = url;
        a.click();
        URL.revokeObjectURL(url);
      } catch (e) {
        console.warn('自动备份失败,继续导入', e);
      }
    }
    // Step 2: 执行导入
    await this.doFinishImport(payload, conflictDecisions);
  },

  /* 执行实际的导入合并逻辑 */
  async doFinishImport(payload, conflictDecisions) {
    const currentByAlias = new Map(this.state.students.map(s => [s.alias, s]));
    let addedCount = 0, mergedCount = 0, skippedCount = 0, renamedCount = 0;
    payload.students.forEach(imp => {
      const decision = conflictDecisions[imp.alias];
      if (!decision) {
        // 不冲突,直接新增(但要重新生成 id 避免冲突)
        const newId = uid('student');
        const idMap = { [imp.id]: newId };
        const newStudent = JSON.parse(JSON.stringify(imp));
        newStudent.id = newId;
        newStudent.observations = (newStudent.observations || []).map(o => ({ ...o, id: uid('obs') }));
        this.state.students.push(newStudent);
        // 转移 name_map
        if (payload.name_map && payload.name_map[imp.id]) {
          this.state.nameMap[newId] = payload.name_map[imp.id];
        }
        addedCount++;
      } else if (decision === 'skip') {
        skippedCount++;
      } else if (decision === 'rename') {
        const newId = uid('student');
        const newStudent = JSON.parse(JSON.stringify(imp));
        newStudent.id = newId;
        newStudent.alias = imp.alias + '(导入)';
        newStudent.observations = (newStudent.observations || []).map(o => ({ ...o, id: uid('obs') }));
        this.state.students.push(newStudent);
        if (payload.name_map && payload.name_map[imp.id]) {
          this.state.nameMap[newId] = payload.name_map[imp.id];
        }
        renamedCount++;
      } else if (decision === 'merge') {
        const current = currentByAlias.get(imp.alias);
        if (!current) return;
        // 合并 observations: 按时间排序,同时间戳两条都保留
        const merged = [...(current.observations || [])];
        (imp.observations || []).forEach(o => {
          merged.push({ ...o, id: uid('obs') }); // 重新生成 id 防止冲突
        });
        merged.sort((a, b) => new Date(a.date) - new Date(b.date));
        current.observations = merged;
        // 真名映射: 如果当前没有但备份里有,则补上
        if (!this.state.nameMap[current.id] && payload.name_map && payload.name_map[imp.id]) {
          this.state.nameMap[current.id] = payload.name_map[imp.id];
        }
        mergedCount++;
      }
    });
    // 持久化
    Store.setStudents(this.state.students);
    if (this.state.nameProtectionPassword) {
      try {
        const enc = await Crypto.encrypt(JSON.stringify(this.state.nameMap), this.state.nameProtectionPassword);
        Store.setNameMapEnc(enc);
      } catch (e) { console.warn('nameMap 重新加密失败', e); }
    }
    this.recordBackupSuccess(); // 导入也视为最近一次"数据已同步"
    this.closeModal();
    this.renderSidebar();
    showToast(`导入完成: 新增 ${addedCount} · 合并 ${mergedCount} · 改名 ${renamedCount} · 跳过 ${skippedCount}`, 'success');
  },

  /* 记录一次成功的备份时间 */
  recordBackupSuccess() {
    Store.setLastBackupAt(Date.now());
    this.updateBackupHealth();
    this._dismissedBanner = false;
  },

  /* 数据变化时标记需要备份(渲染脉冲提示) */
  markBackupDirty(reason) {
    // 关键动作后让健康指示器轻微脉冲提醒用户
    if (this.state.config?.demo_mode) return;
    const ind = $('#backup-indicator');
    if (!ind) return;
    ind.classList.remove('pulse');
    void ind.offsetWidth; // 触发 reflow 重启动画
    ind.classList.add('pulse');
    // 5 秒后显示一行小字
    const hint = $('#backup-hint');
    if (hint) {
      hint.textContent = '建议导出备份';
      hint.style.opacity = '1';
      clearTimeout(this._hintTimer);
      this._hintTimer = setTimeout(() => { hint.style.opacity = '0'; }, 5000);
    }
  },

  /* 更新备份健康指示器颜色(绿/黄/红) */
  updateBackupHealth() {
    const ind = $('#backup-indicator');
    if (!ind) return;
    if (this.state.config?.demo_mode) {
      ind.style.display = 'none';
      return;
    }
    ind.style.display = 'inline-flex';
    const last = Store.getLastBackupAt();
    const now = Date.now();
    const days = last ? Math.floor((now - last) / 86400000) : Infinity;
    let color, text;
    if (days === Infinity) { color = '#993C1D'; text = '从未备份'; }
    else if (days <= 7) { color = '#5C8B5A'; text = `${days} 天前备份`; }
    else if (days <= 14) { color = '#D49C3D'; text = `${days} 天前备份`; }
    else { color = '#993C1D'; text = `${days} 天前备份`; }
    ind.style.background = color;
    ind.title = '上次备份: ' + text + '(点击导出新备份)';
  },

  /* 启动时检查:超过 7 天显示横幅 */
  checkBackupBanner() {
    if (this.state.config?.demo_mode) return;
    const last = Store.getLastBackupAt();
    const now = Date.now();
    const days = last ? Math.floor((now - last) / 86400000) : Infinity;
    if (days < 7) return;
    // 同一天最多弹一次
    const dismissKey = 'pgw_banner_dismissed_at';
    const dismissedAt = Number(localStorage.getItem(dismissKey) || 0);
    if (now - dismissedAt < 86400000) return; // 24 小时内不再弹
    this.showBackupBanner(days);
  },

  showBackupBanner(days) {
    const banner = $('#backup-inline-banner');
    const text = $('#inline-banner-text');
    if (!banner || !text) return;
    const msg = days === Infinity
      ? '您尚未导出过数据备份。本机浏览器数据丢失后将无法恢复。'
      : `距上次备份已 ${days} 天。建议定期导出备份,以防本机数据丢失。`;
    text.textContent = msg;
    banner.style.display = 'flex';
  },

  /* ============================================================
     演示模式: 模拟 AI 翻译（不调用真实 API）
     ============================================================ */
  async mockTranslateNarrative(rawText) {
    // 假装 AI 思考 1.5-2 秒
    await new Promise(r => setTimeout(r, 1500 + Math.random() * 500));
    const text = String(rawText || '');
    for (const tpl of MOCK_TRANSLATIONS) {
      if (!tpl.keywords.length) continue;
      for (const kw of tpl.keywords) {
        if (text.includes(kw)) {
          return JSON.parse(JSON.stringify(tpl.output));
        }
      }
    }
    return JSON.parse(JSON.stringify(MOCK_TRANSLATIONS[MOCK_TRANSLATIONS.length - 1].output));
  },

    /* ============================================================
     Modal helper
     ============================================================ */
  openModal(html) {
    const root = $('#modal-root');
    root.innerHTML = `<div class="modal-backdrop">${html}</div>`;
    const backdrop = root.querySelector('.modal-backdrop');
    // 事件代理：捕获所有 [data-close] 的点击（不论后续是否 innerHTML 重写）
    backdrop.addEventListener('click', e => {
      if (e.target === backdrop) { this.closeModal(); return; }
      if (e.target.closest('[data-close]')) this.closeModal();
    });
  },
  closeModal() {
    $('#modal-root').innerHTML = '';
  }
};
