<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理个案工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<!-- html2pdf.js for PDF export -->
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<!-- mammoth.js for docx import -->
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
/* =============================================================
   视觉规范变量 —— 与项目状态文档色板一致
   ============================================================= */
:root {
  --bg-grad: linear-gradient(135deg, #F0F5FA 0%, #E8EFF5 100%);
  --color-primary: #3B6B7C;
  --color-primary-light: #5A8898;
  --color-primary-soft: #7BA6B5;
  --color-card-bg: rgba(255, 255, 255, 0.92);
  --color-card-bg-strong: rgba(255, 255, 255, 0.96);
  --color-glass: rgba(255, 255, 255, 0.65);
  --color-text-main: #1A2A33;
  --color-text-sub: #5F6B72;
  --color-text-muted: #8A9499;
  --color-border-light: rgba(20, 50, 70, 0.06);
  --color-border: rgba(20, 50, 70, 0.10);
  --color-border-strong: rgba(20, 50, 70, 0.18);

  --warn-light: #BA7517;
  --warn-mid: #854F0B;
  --warn-red: #993C1D;
  --warn-deep: #6F2A14;
  --cat-purple: #7A5BB8;

  --radius-card: 9px;
  --radius-btn: 6px;
  --radius-input: 6px;
  --radius-pill: 5px;

  --shadow-soft: 0 1px 2px rgba(20, 50, 70, 0.04), 0 2px 8px rgba(20, 50, 70, 0.03);
  --shadow-modal: 0 8px 32px rgba(20, 50, 70, 0.12), 0 2px 8px rgba(20, 50, 70, 0.06);

  --font-cn: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-en: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-cn);
  font-size: 14px;
  color: var(--color-text-main);
  background: var(--bg-grad);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

/* 数字、日期等用等宽 */
.mono, .num, time, .timestamp { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* =============================================================
   视图切换
   ============================================================= */
.view { display: none; min-height: 100vh; }
.view.active { display: block; }

/* =============================================================
   引导页（onboarding）
   ============================================================= */
#onboarding-view {
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
#onboarding-view.active { display: flex; }

.onboarding-card {
  width: 100%;
  max-width: 520px;
  background: var(--color-card-bg-strong);
  border-radius: 12px;
  box-shadow: var(--shadow-modal);
  padding: 40px 44px;
  border: 1px solid var(--color-border-light);
}

.onboarding-step-indicator {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
  justify-content: center;
}
.onboarding-step-indicator .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--color-border-strong);
}
.onboarding-step-indicator .dot.active { background: var(--color-primary); width: 24px; border-radius: 3px; }

.onboarding-title {
  font-size: 22px; font-weight: 600;
  color: var(--color-text-main);
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}
.onboarding-subtitle {
  font-size: 13.5px; color: var(--color-text-sub);
  line-height: 1.7;
  margin-bottom: 28px;
}

.input-group { margin-bottom: 18px; }
.input-group label {
  display: block;
  font-size: 12.5px;
  color: var(--color-text-sub);
  margin-bottom: 6px;
  font-weight: 500;
}
.input-group input,
.input-group textarea,
.input-group select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-input);
  background: rgba(255, 255, 255, 0.7);
  transition: border-color 0.15s, background 0.15s;
}
.input-group input:focus,
.input-group textarea:focus,
.input-group select:focus {
  outline: none;
  border-color: var(--color-primary-light);
  background: white;
}
.input-group .hint {
  font-size: 11.5px; color: var(--color-text-muted);
  margin-top: 5px;
  line-height: 1.5;
}

.btn {
  padding: 9px 18px;
  border-radius: var(--radius-btn);
  font-size: 13.5px;
  font-weight: 500;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn-primary {
  background: var(--color-primary);
  color: white;
}
.btn-primary:hover { background: var(--color-primary-light); }
.btn-secondary {
  background: rgba(59, 107, 124, 0.08);
  color: var(--color-primary);
}
.btn-secondary:hover { background: rgba(59, 107, 124, 0.14); }
.btn-ghost {
  color: var(--color-text-sub);
}
.btn-ghost:hover { color: var(--color-text-main); }
.btn-danger {
  background: var(--warn-mid);
  color: white;
}
.btn-danger:hover { background: var(--warn-deep); }

.btn-full { width: 100%; justify-content: center; padding: 11px 18px; font-size: 14px; }

.onboarding-actions {
  display: flex;
  gap: 10px;
  margin-top: 28px;
  justify-content: space-between;
  align-items: center;
}

.recovery-code-display {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.06em;
  background: rgba(59, 107, 124, 0.06);
  border: 1px dashed var(--color-primary-soft);
  padding: 18px 20px;
  border-radius: 8px;
  text-align: center;
  color: var(--color-primary);
  margin: 16px 0;
  user-select: all;
}

.warning-box {
  background: rgba(186, 117, 23, 0.06);
  border-left: 3px solid var(--warn-light);
  padding: 12px 14px;
  border-radius: 4px;
  font-size: 12.5px;
  color: var(--warn-mid);
  line-height: 1.6;
  margin: 16px 0;
}

/* =============================================================
   登录页
   ============================================================= */
#login-view {
  display: none;
  align-items: center;
  justify-content: center;
}
#login-view.active { display: flex; }

.login-card {
  width: 100%;
  max-width: 380px;
  padding: 36px 40px;
  background: var(--color-card-bg-strong);
  border-radius: 12px;
  box-shadow: var(--shadow-modal);
  border: 1px solid var(--color-border-light);
}

.login-logo {
  text-align: center;
  margin-bottom: 24px;
}
.login-logo .logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px; height: 52px;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
  border-radius: 12px;
  margin-bottom: 12px;
  color: white;
}
.login-logo h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--color-text-main);
}
.login-logo .subtitle {
  font-size: 12px;
  color: var(--color-text-muted);
  margin-top: 4px;
}

/* =============================================================
   主工作台 - 顶栏
   ============================================================= */
#main-view {
  display: none;
  flex-direction: column;
  height: 100vh;
}
#main-view.active { display: flex; }

.top-bar {
  flex-shrink: 0;
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  background: var(--color-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--color-border-light);
  position: relative;
  z-index: 10;
}

.top-bar .logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 15px;
  color: var(--color-primary);
  margin-right: 24px;
}
.top-bar .logo-mark-sm {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.breadcrumb {
  font-size: 13px;
  color: var(--color-text-sub);
  flex: 1;
}
.breadcrumb .crumb-link {
  cursor: pointer;
  color: var(--color-primary);
}
.breadcrumb .crumb-link:hover { text-decoration: underline; }
.breadcrumb .sep { margin: 0 8px; color: var(--color-text-muted); }
.breadcrumb .current { color: var(--color-text-main); font-weight: 500; }

.top-bar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* 化名指示器 */
.name-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 500;
}
.name-indicator.alias-mode {
  background: rgba(59, 107, 124, 0.08);
  color: var(--color-primary);
}
.name-indicator.alias-mode:hover { background: rgba(59, 107, 124, 0.14); }
.name-indicator.real-mode {
  background: rgba(186, 117, 23, 0.12);
  color: var(--warn-mid);
}
.name-indicator .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* =============================================================
   主工作台 - 工作区 sidebar + content
   ============================================================= */
.workspace {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.45);
  border-right: 1px solid var(--color-border-light);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 16px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--color-border-light);
}
.sidebar-header h3 {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--color-text-main);
}
.sidebar-header .count {
  font-size: 11.5px;
  color: var(--color-text-muted);
  font-family: var(--font-mono);
}

.new-case-dropdown {
  position: relative;
}
.new-case-btn {
  background: var(--color-primary);
  color: white;
  width: 26px; height: 26px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
}
.new-case-btn:hover { background: var(--color-primary-light); }
.new-case-menu {
  position: absolute;
  top: 32px; right: 0;
  width: 200px;
  background: white;
  border-radius: 8px;
  box-shadow: var(--shadow-modal);
  border: 1px solid var(--color-border);
  padding: 6px;
  display: none;
  z-index: 100;
}
.new-case-menu.open { display: block; }
.new-case-menu-item {
  display: flex;
  flex-direction: column;
  padding: 9px 12px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.15s;
}
.new-case-menu-item:hover { background: rgba(59, 107, 124, 0.06); }
.new-case-menu-item .title { font-size: 13px; font-weight: 500; color: var(--color-text-main); }
.new-case-menu-item .desc { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }

.settings-dropdown { position: relative; display: inline-block; }
.settings-menu {
  position: absolute;
  top: 38px; right: 0;
  width: 230px;
  background: white;
  border-radius: 8px;
  box-shadow: var(--shadow-modal);
  border: 1px solid var(--color-border);
  padding: 6px;
  display: none;
  z-index: 100;
}
.settings-menu.open { display: block; }
.settings-menu-item {
  display: flex;
  flex-direction: column;
  padding: 9px 12px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.15s;
}
.settings-menu-item:hover { background: rgba(59, 107, 124, 0.06); }
.settings-menu-item .title { font-size: 13px; font-weight: 500; color: var(--color-text-main); }
.settings-menu-item .desc { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }
.settings-menu-item.danger .title { color: #993C1D; }
.settings-menu-item.danger:hover { background: rgba(153, 60, 29, 0.06); }
.settings-menu-divider {
  height: 1px;
  background: var(--color-border);
  margin: 4px 6px;
}

/* 备份健康指示器 + 关键动作脉冲提示 */
.backup-indicator-wrap {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  margin-right: 4px;
}
.backup-indicator {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #5C8B5A;
  display: inline-block;
  transition: background 0.2s;
}
.backup-indicator.pulse {
  animation: pulse-glow 1.6s ease-out 2;
}
@keyframes pulse-glow {
  0%   { box-shadow: 0 0 0 0 rgba(212, 156, 61, 0.7); transform: scale(1); }
  50%  { box-shadow: 0 0 0 8px rgba(212, 156, 61, 0); transform: scale(1.3); }
  100% { box-shadow: 0 0 0 0 rgba(212, 156, 61, 0); transform: scale(1); }
}
.backup-hint {
  font-size: 11.5px;
  color: var(--color-text-sub);
  opacity: 0;
  transition: opacity 0.4s;
  white-space: nowrap;
}

/* 备份提示横幅(旧顶部样式已废弃,改为 .backup-inline-banner 渲染在今日待办卡片内) */

/* 演示模式警示条(AI 翻译输出顶部 + 导出预览顶部) */
.demo-mode-warning {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
  padding: 10px 14px;
  background: linear-gradient(90deg, rgba(212,156,61,0.14), rgba(212,156,61,0.06));
  border: 1px solid rgba(212,156,61,0.4);
  border-left: 3px solid #D49C3D;
  border-radius: 6px;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--color-text-main);
}
.demo-mode-warning .dmw-icon { font-size: 14px; flex-shrink: 0; }
.demo-mode-warning .dmw-text strong {
  display: block;
  color: #8C6A26;
  margin-bottom: 3px;
  font-weight: 600;
}

.student-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.list-group {
  padding: 6px 0;
}
.list-group-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  font-size: 11px;
  font-weight: 600;
  color: var(--color-text-muted);
  letter-spacing: 0.04em;
  text-transform: none;
}
.list-group-header .level-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
}
.level-dot.l1 { background: var(--color-primary-soft); }
.level-dot.l2 { background: var(--warn-light); }
.level-dot.l3 { background: var(--warn-red); }

.student-item {
  padding: 9px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.12s;
  border-left: 3px solid transparent;
}
.student-item:hover { background: rgba(59, 107, 124, 0.04); }
.student-item.active {
  background: rgba(59, 107, 124, 0.08);
  border-left-color: var(--color-primary);
}
.student-item .avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--color-primary-soft) 0%, var(--color-primary-light) 100%);
  color: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 500;
  flex-shrink: 0;
}
.student-item .info {
  flex: 1;
  min-width: 0;
}
.student-item .name {
  font-size: 13px;
  color: var(--color-text-main);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.student-item .meta {
  font-size: 11px;
  color: var(--color-text-muted);
  margin-top: 1px;
}
.student-item .last-update {
  font-size: 10.5px;
  color: var(--color-text-muted);
  font-family: var(--font-mono);
  transition: opacity 0.15s;
}
.student-del-btn {
  position: absolute;
  right: 14px;
  width: 26px; height: 26px;
  border-radius: 5px;
  background: rgba(153, 60, 29, 0.08);
  color: #993C1D;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
  border: none;
  padding: 0;
}
.student-del-btn:hover { background: rgba(153, 60, 29, 0.18); }
.student-item { position: relative; }
.student-item:hover .last-update { opacity: 0; }
.student-item:hover .student-del-btn { display: inline-flex; }

/* =============================================================
   主工作台 - 主内容区
   ============================================================= */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px 40px;
}

.mode-view { display: none; }
.mode-view.active { display: block; }

/* 总览模式 - 顶部统计卡片 */
.stat-cards {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--color-card-bg);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-card);
  padding: 16px 16px 14px;
  box-shadow: var(--shadow-soft);
}
.stat-card .label {
  font-size: 12px;
  color: var(--color-text-sub);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.stat-card .value {
  font-size: 28px;
  font-weight: 600;
  color: var(--color-text-main);
  font-family: var(--font-mono);
  line-height: 1;
  letter-spacing: -0.02em;
}
.stat-card .delta {
  font-size: 11px;
  color: var(--color-text-muted);
  margin-top: 6px;
}
.stat-card.alert .value { color: var(--warn-mid); }
.stat-card.warn .value { color: var(--warn-light); }

/* 总览模式 - 图表区 */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 14px;
  margin-bottom: 22px;
}
.dashboard-card {
  background: var(--color-card-bg);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-card);
  padding: 18px 20px 16px;
  box-shadow: var(--shadow-soft);
}
.dashboard-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 12px;
}
.dashboard-card .card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-main);
}
.dashboard-card .card-meta {
  font-size: 11.5px;
  color: var(--color-text-muted);
}

#chart-risk { height: 280px; }
#chart-category { height: 280px; }

/* 今日待办 */
.todo-card {
  background: var(--color-card-bg);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-card);
  padding: 18px 20px;
  box-shadow: var(--shadow-soft);
}
.todo-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 10px;
  max-height: 240px;
  overflow-y: auto;
  padding-right: 4px;
}
.todo-list::-webkit-scrollbar { width: 6px; }
.todo-list::-webkit-scrollbar-thumb { background: rgba(59, 107, 124, 0.25); border-radius: 3px; }
.todo-list::-webkit-scrollbar-track { background: transparent; }
.todo-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(59, 107, 124, 0.03);
  border-radius: 6px;
  border-left: 3px solid var(--color-primary-soft);
  font-size: 13px;
}
.todo-item.priority-high { border-left-color: var(--warn-red); background: rgba(153, 60, 29, 0.04); }
.todo-item.priority-mid { border-left-color: var(--warn-light); background: rgba(186, 117, 23, 0.04); }
.todo-item .text { flex: 1; line-height: 1.5; color: var(--color-text-main); }
.todo-item .meta { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }
.todo-item .action { font-size: 12px; }

/* 今日待办卡片内的备份提示条 */
.backup-inline-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding: 9px 12px;
  background: linear-gradient(90deg, rgba(212,156,61,0.12), rgba(212,156,61,0.04));
  border: 1px solid rgba(212,156,61,0.3);
  border-radius: 6px;
  font-size: 12.5px;

          teacher_final: { narrative: { behavior: '第二次家校沟通。母亲首次表达自身焦虑的存在，从"我不逼他不行"过渡到"我控制不住"。情绪反应自然真实。', emotion_cognition: '母亲对自身的觉察从"我是为孩子好"的合理化框架进入到"我自己也有问题"的反思框架。这一转变对家庭互动模式的改变是更深层的契机。', possible_causes: '经过近两个月的接触，母亲的防御逐渐降低；孩子的好转—反复曲线让母亲看到自己反应方式的具体影响。', intervention_suggestions: '抓住这一窗口，简短提供母亲自身情绪管理的基本资源。可推荐一两个面向家长的公益讲座。学生层面继续巩固上次的认知练习。' }, tags: { behavior_categories: ['家庭沟通'], emotion_intensity: 3, risk_level: '重点关注', need_family_school_communication: true } }, ai_original: null, confirmed: true },
        { id: 'obs_chen_7', date: '2026-05-09T10:15', raw_text: '最近小陈状态比较稳定。今天约谈，他主动告诉我画画交了一幅参加年级画展，得了鼓励奖。他说妈妈看到证书的时候愣了一下，然后说"还行"。他笑着告诉我，"还行"就是夸了。问他如果下次单元测验又没考好怎么办，他想了想说"那再画一张更好的呗"。',
          teacher_final: { narrative: { behavior: '社会功能恢复——绘画兴趣稳定且获得正向反馈，能客观评估母亲的情感表达（"还行就是夸了"），对未来挫折表达出有弹性的应对预期。', emotion_cognition: '从"我是笨的"到"我努力了她不满意"再到"我可以用画画回应"——这是一个完整的自我效能感重建路径。学生已开始用自己的方式处理家庭评价压力。', possible_causes: '历时两个月的多层面干预（个体约谈+家校沟通两次+班主任协作）的综合效果。母亲的根本性反思与学生的认知练习同步推进。', intervention_suggestions: '进入巩固期，约谈频率降至每月一次。告知班主任观察要点，重点关注下次单元测验后的情绪反应。如无明显反复，学期末考虑结案。' }, tags: { behavior_categories: ['同伴关系'], emotion_intensity: 1, risk_level: '一般关注', need_family_school_communication: false } }, ai_original: null, confirmed: true }
      ],
      current_assessment: ''

    {
      id: 'demo_zhao', alias: '学生·赵', real_name: '赵XX',
      basic_info: { class: '三(1)班', gender: '女', age: 9, referral_source: '本人主动求助' },
      family_background: { structure: '父母与本人、一年级弟弟', primary_caregiver: '母亲', events: '父亲长期在外地工作，母亲一人照顾两个孩子，长姐承担部分照护责任' },
      initial_assessment: '主动求助，情绪有轻度波动，功能基本完好，但存在周期性反复。家庭中承担超龄的照护角色。',
      observations: [
        { id: 'obs_zhao_1', date: '2026-02-20T10:30', raw_text: '今天课间小赵自己跑到办公室来，说"老师我能跟你说说话吗"。我说当然可以。她坐下来说"我最近写作业的时候老是有点心烦，但我作业都做完了"。问她什么事让她心烦，她抠着自己的指甲想了半天说"我也说不清，就是有点烦"。',
          teacher_final: { narrative: { behavior: '三年级学生主动到心理老师处求助。能完成作业等基本学习任务。约谈中能识别"心烦"的情绪但无法定位具体原因。', emotion_cognition: '存在轻度的负性情绪体验，但未影响学习功能。学生具备情绪觉察意识与求助行为——这是显著的保护性因素。', possible_causes: '可能与近期同伴关系、家庭节奏、或情绪发展期相关。三年级学生开始有更复杂的内在体验但表达能力仍在发展中。', intervention_suggestions: '保持持续关注。下次约谈通过具体生活场景（学校一天、家里一天）引导学生识别情绪发生的时间点。可向班主任了解学生近期课堂状态。' }, tags: { behavior_categories: ['其他'], emotion_intensity: 2, risk_level: '一般关注', need_family_school_communication: false } }, ai_original: null, confirmed: true },
        { id: 'obs_zhao_2', date: '2026-03-05T16:00', raw_text: '第二次约谈。我用了上次想的办法，让小赵给我画一下她"普通一天"。她画完之后指着大课间那一格说"这里"。我问大课间发生了什么。她说她原来最好的朋友这周不跟她一起玩了，跟另一个女生玩。"我去找她她也不理我。"说到这里眼圈红了。我问她有没有问过对方为什么，她摇头说"我不敢问，怕她说我哪里不好"。',
          teacher_final: { narrative: { behavior: '通过画"普通一天"的方法成功定位情绪发生的具体场景（大课间同伴互动）。讨论中眼眶发红但能控制。明确表达回避主动沟通的原因。', emotion_cognition: '将同伴疏远归因于"我可能哪里不好"，存在指向自身的归因模式。三年级女生的友谊敏感期是常态，但回避应对值得关注。', possible_causes: '三年级学生的同伴关系从"一起玩"过渡到"选择性友谊"的发展阶段，独占式好朋友失落是常见情境。学生缺乏处理这种过渡的具体策略。', intervention_suggestions: '下次约谈做一个简单的练习——如果想跟好朋友说话，但又怕被拒绝，可以用什么方式？写小纸条、课间一起走一段路、借橡皮。给具体可操作的小台阶。' }, tags: { behavior_categories: ['同伴关系'], emotion_intensity: 3, risk_level: '重点关注', need_family_school_communication: false } }, ai_original: null, confirmed: true },
        { id: 'obs_zhao_3', date: '2026-03-19T15:30', raw_text: '今天小赵一进办公室就笑着说"老师我们和好了"。她听了我的建议，写了一张小纸条折成爱心放进对方的铅笔盒，上面写"我们还是好朋友吗"。下午对方就来找她了，说"我以为你不想跟我玩了"。小赵说她当时眼泪就下来了。"原来不是我哪里不好。"',
          teacher_final: { narrative: { behavior: '主动尝试上次约谈建议的沟通方法并获得正向反馈。情绪明显提升，能笑着分享。能用语言描述事件经过与情绪反应。', emotion_cognition: '成功的社交经验直接修正了"是我哪里不好"的归因。"原来不是我哪里不好"这句话本身就是认知层面的纠正。', possible_causes: '一次成功的小行动打破了"主动=可能被拒绝"的预期。学生的内部资源（写纸条这一选择本身）被激活并验证。', intervention_suggestions: '巩固这次成功经验，可以引导她总结"我这次是怎么做到的"——把方法从一次性的偶然变成可重复的能力。约谈频率可降至两周一次。' }, tags: { behavior_categories: ['同伴关系'], emotion_intensity: 1, risk_level: '一般关注', need_family_school_communication: false } }, ai_original: null, confirmed: true },
        { id: 'obs_zhao_4', date: '2026-04-02T16:30', raw_text: '隔了两周再见，小赵状态又下来了一点。她说这周班里搞小组活动分组，老师让自由分组，"大家都很快有人选了，就剩我和另外两个不太熟的同学"。她说她当时站在那里特别想哭，但忍住了。又说昨天弟弟数学只考了18星，妈妈在饭桌上骂弟弟，骂到一半突然指着她说"你做姐姐的也不知道帮帮他"。她说她当时眼泪就下来了，但什么都没说。',
          teacher_final: { narrative: { behavior: '自由分组场景中暂时被边缘化但能自我调节（未哭）。在家庭情境中被母亲卷入弟弟的学业问题受到指责，情绪反应明显但被压抑。', emotion_cognition: '将"忍住没哭"作为可表达的成就感来源，说明学生开始有意识地管理情绪表现。在家庭议题上则呈现"承受但不回应"的退缩模式。', possible_causes: '自由分组对低年级敏感期儿童是常见压力源。家庭层面，三年级承担"姐姐管弟弟"的隐性责任超出年龄能力，且不被正面认可。', intervention_suggestions: '与班主任沟通分组场景的支持策略（例如教师辅助分组）。关注家庭议题，下次约谈可探索她对"姐姐"角色的理解。短期内不直接联系家长，先听学生的视角。' }, tags: { behavior_categories: ['同伴关系','家庭沟通'], emotion_intensity: 3, risk_level: '重点关注', need_family_school_communication: true } }, ai_original: null, confirmed: true },
        { id: 'obs_zhao_5', date: '2026-04-23T15:00', raw_text: '今天小赵主动来找我，说昨晚弟弟又因为没写完作业被妈妈骂，妈妈骂得很凶。小赵说她坐在弟弟旁边写自己的作业，写不下去。"我跟我妈说我也没写完，我妈说‘你都三年级了能比弟弟差吗’，然后又开始骂弟弟。"她说她不知道怎么帮弟弟，但她妈妈一骂她就很难受。',
          teacher_final: { narrative: { behavior: '在家庭冲突场景中处于"陪同"位置，自身学习被影响。能向母亲表达自己的需要但被否定。能向心理老师讲述事件经过。', emotion_cognition: '在家庭系统中既不是直接被骂的对象、也不是事不关己的旁观者，而是被"做姐姐"的隐性期待绑住。这种位置上的模糊感是其情绪困扰的核心来源。', possible_causes: '父亲长期不在家，母亲一人面对两个孩子的学业压力，无意中将长女作为"应该懂事"的成熟角色对待。母亲自身的压力管理能力有限。', intervention_suggestions: '在适当时机与母亲沟通，温和传达"姐姐也是孩子、也需要被支持"的信息。学生层面可做"什么是我能做的、什么不是"的区分练习。' }, tags: { behavior_categories: ['家庭沟通'], emotion_intensity: 3, risk_level: '重点关注', need_family_school_communication: true } }, ai_original: null, confirmed: true },
        { id: 'obs_zhao_6', date: '2026-05-08T15:00', raw_text: '今天小赵又来了，说"老师我又有点烦"。问她为什么，她想了想说"也没什么大事，就是有点烦"。我注意到这句话跟她第一次来找我说的几乎一样。她笑了一下说"是不是我老是这样啊"。我说"你这样反复来找我聊聊，是个好习惯"。她想了想点了点头。',
          teacher_final: { narrative: { behavior: '再次以相似的主诉求助。学习功能基本维持，能在情绪困扰早期识别并求助。能自我反思"是不是老是这样"。', emotion_cognition: '周期性出现的模糊疲惫感可能是慢性的低强度情绪负荷，而非单次事件的急性反应。学生开始觉察自身的循环模式——这种元觉察本身就是进步。', possible_causes: '家庭照料角色的持续负担是一个持续性的低强度压力源；父亲长期不在家导致家庭情绪支持系统不完整。', intervention_suggestions: '维持每两周一次的约谈节奏，不主动减频——稳定的关系本身就是支持。可与班主任沟通持续关注。下学期开学后视情况评估是否需要更深入的家庭层面工作。' }, tags: { behavior_categories: ['其他'], emotion_intensity: 2, risk_level: '一般关注', need_family_school_communication: false } }, ai_original: null, confirmed: true }
      ],
      current_assessment: ''

    {
      id: 'demo_lin', alias: '学生·林', real_name: '林XX',
      basic_info: { class: '四(5)班', gender: '女', age: 10, referral_source: '校医反馈' },
      family_background: { structure: '父母离异，与母亲同住', primary_caregiver: '母亲', events: '父母三年前离异（学生一年级时），与父亲较少接触。母亲近期工作调动，工作强度明显增加，常加班且周末参加进修。' },
      initial_assessment: '校医反映本月已两次因肚子痛/头痛到医务室，体检未见器质性问题。建议转介评估情绪状态。',
      observations: [
        { id: 'obs_lin_1', date: '2026-02-14T09:30', raw_text: '校医王老师转介过来的。第一次见小林，她坐得很端正，回答问题条理很清楚。问她最近怎么经常肚子痛，她说"我也不知道，医生说没事"。问她在学校怎么样，她说"挺好的，老师都对我很好"。问她在家怎么样，她说"也挺好的，妈妈很忙但她对我很好"。整场都是这种"标准答案"，但她笑容比一般四年级孩子少。',
          teacher_final: { narrative: { behavior: '四年级学生首次约谈表现礼貌、回答有条理，但内容偏社交性。提及躯体症状（肚子痛）但医学检查无异常。整场缺乏年龄相应的情绪自然流露。', emotion_cognition: '表面的"懂事"可能是一种适应策略——尤其在父母离异、母亲忙碌的家庭背景下，"不给妈妈添麻烦"可能是孩子内化的规则。躯体化症状可能是未被表达的情绪压力的出口。', possible_causes: '离异家庭中长大的孩子常发展出超龄的情绪自控，这种自控对外有保护作用但可能压抑了应有的情绪表达通道。', intervention_suggestions: '暂不做深入探索，以建立信任关系为主。每周一次约谈，关注肚子痛的频率变化。与校医保持信息互通。' }, tags: { behavior_categories: ['进食睡眠'], emotion_intensity: 2, risk_level: '一般关注', need_family_school_communication: false } }, ai_original: null, confirmed: true },
        { id: 'obs_lin_2', date: '2026-03-01T14:00', raw_text: '第三次约谈了，前两次她都很客气。今天我让她画家里的样子。她画了一个房间，沙发上是妈妈拿着手机在打电话，旁边书桌前是她在写作业。我问妈妈在跟谁打电话，她说"工作的电话，妈妈最近老打工作的电话"。又问那爸爸呢，她笔停了一下说"爸爸不住在这里"。然后又自己补了一句"其实也挺好的，我自己一个人也能写作业"。',
          teacher_final: { narrative: { behavior: '通过绘画间接表达家庭日常场景。能识别画中的细节并解释。在提到父亲时出现短暂的笔触停顿。主动用"也挺好的"封堵进一步探索。', emotion_cognition: '在单亲家庭中感受到一种隐性的孤独，但将这种感受合理化为"挺好的"。这种合理化可能是长期发展出的情绪管理模式。', possible_causes: '离异加母亲工作繁忙的家庭组合使学生在大量时间里独自相处。学生用"我自己也能"来回应需求未被满足的现实。', intervention_suggestions: '继续以稳定的约谈节奏提供可预期的情感关系，让学生在安全环境中逐渐练习表达需求。暂不推动家庭层面的沟通，时机未到。' }, tags: { behavior_categories: ['家庭沟通'], emotion_intensity: 2, risk_level: '一般关注', need_family_school_communication: false } }, ai_original: null, confirmed: true },
        { id: 'obs_lin_3', date: '2026-03-20T10:30', raw_text: '最近小林瘦了，校服显得空了一点。校医反映她本周已经第二次去医务室，还是肚子痛。她说"我也不知道怎么了，就是吃不下"。班主任陈老师也来跟我说，小林这周上课叫她两遍才回过神，跟以前完全不一样。我问她最近睡得好不好，她说"睡得着，但是有点容易醒"。',
          teacher_final: { narrative: { behavior: '躯体症状（肚子痛、食欲下降）频率增加，体重轻微下降。课堂注意力出现明显下降，被班主任观察到。睡眠质量受影响。', emotion_cognition: '躯体化症状的多线呈现（消化、注意力、睡眠）反映情绪压力的累积可能已超出学生当前的心理应对资源。', possible_causes: '长期压抑的情绪压力开始影响生理层面的功能。家庭层面的孤独感与缺乏情感表达渠道可能是核心动力。', intervention_suggestions: '调整约谈频率为每周两次。开始考虑是否需要建议家长带去专业机构做进一步评估。与班主任沟通课堂支持策略。' }, tags: { behavior_categories: ['进食睡眠','家庭沟通'], emotion_intensity: 3, risk_level: '重点关注', need_family_school_communication: false } }, ai_original: null, confirmed: true },
        { id: 'obs_lin_4', date: '2026-04-10T11:00', raw_text: '今天约谈，小林一进来就说"老师我可不可以跟你说一件事"。我说当然可以。她沉默了很久，然后突然哭了。她说昨天周六妈妈又去进修了，她一个人在家从早上到晚上。她中午吃了点冰箱里剩的，下午就一个人坐在沙发上看天黑。她说"我有时候在想，是不是我不在妈妈也不会发现"。我心里咯噔一下。我问她有没有想过让自己受伤，她摇头很快，说"没有没有，我不会的"。但她又说"就是觉得活着挺累的"。',

   工具函数

const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDate(d) {
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  const y = dt.getFullYear(), m = String(dt.getMonth()+1).padStart(2,'0'), day = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function formatDateTime(d) {
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  const y = dt.getFullYear(), mo = String(dt.getMonth()+1).padStart(2,'0'), day = String(dt.getDate()).padStart(2,'0');
  const h = String(dt.getHours()).padStart(2,'0'), mi = String(dt.getMinutes()).padStart(2,'0');
  return `${y}-${mo}-${day} ${h}:${mi}`;
}
function uid(prefix='id') { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`; }

function showToast(msg, type='') {

}

/* 简化版 Markdown 渲染:足够预览班主任版/家长版/学校上级版 */
function renderMarkdown(md) {
  if (!md) return '';
  let html = escapeHtml(md);
  html = html.replace(/^\*\*(.+?)\*\*$/gm, '<h3>$1</h3>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
  // 列表
  html = html.replace(/(^- .+\n?)+/gm, m => {
    const items = m.trim().split('\n').map(l => l.replace(/^- /, '').trim()).filter(Boolean).map(l => `<li>${l}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // 段落
  html = html.split(/\n{2,}/).map(p => {
    if (p.startsWith('<')) {
      // 段内可能是"块级标签 + 后续裸文本行"的混合，需要把裸文本行单独包成 <p>
      if (p.includes('\n')) {
        const lines = p.split('\n');
        const out = [];
        for (const line of lines) {
          const ln = line.trim();
          if (!ln) continue;
          if (ln.startsWith('<')) out.push(line);
          else out.push(`<p>${line}</p>`);
        }
        return out.join('');
      }
      return p;
    }
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return html;
}

/* 剥掉 AI 在导出稿件顶部加的导入语 / 自我说明 / 顶部分隔符。
   只清理顶部连续的"非内容行"，遇到第一行正文即停止，不会误删正文里的分隔符。 */
function stripPreamble(md) {
  if (!md) return '';
  let text = String(md).replace(/^\uFEFF/, '').trim();
  const dropPatterns = [
    /^好的[，,。.！!]?.*$/,
    /^以下[是为].*$/,
    /^这是.*$/,
    /^根据[您你].*$/,
    /^我[已为将能可].*$/,
    /^我来.*$/,
    /^现在.*$/,
    /^下面.*$/,
    /^---+$/,
    /^={3,}$/,
    /^\*{3,}$/,
  ];
  let guard = 20;
  while (guard-- > 0) {
    text = text.trimStart();
    const nl = text.indexOf('\n');
    const firstLine = (nl === -1 ? text : text.slice(0, nl)).trim();
    if (!firstLine) { text = nl === -1 ? '' : text.slice(nl + 1); continue; }
    let matched = false;
    for (const re of dropPatterns) {
      if (re.test(firstLine)) {
        text = nl === -1 ? '' : text.slice(nl + 1);
        matched = true;
        break;
      }
    }
    if (!matched) break;
  }
  // 把 AI 输出中遗留的 [当前日期] 占位符替换为今天的实际日期
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  text = text.replace(/\[当前日期\]/g, todayStr);
  return text.trim();
}

/* =============================================================
   导出样式注入（Word / PDF 共用）
   - 字体名用 &quot; 转义，避免与 style 属性外层双引号冲突
   - 信件版本（teacher / parent）做"称呼/问候/正文/落款"启发式识别
   - 其他版本（superior / peer）按一般文档：标题居中、正文首行缩进 2 字符
   ============================================================= */
const EXPORT_FF = '&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,&quot;SimSun&quot;,sans-serif';

function _exportStyle(role) {
  const ff = EXPORT_FF;
  const C = '#1A2A33';
  switch (role) {
    case 'title':       return `font-family:${ff};font-size:16pt;font-weight:bold;line-height:1.5;text-align:center;margin:18px 0 14px;color:${C};`;
    case 'subtitle':    return `font-family:${ff};font-size:12pt;font-weight:bold;line-height:1.6;margin:14px 0 8px;color:${C};`;
    case 'salutation':  return `font-family:${ff};font-size:11pt;line-height:1.9;text-indent:0;margin:8px 0 4px;color:${C};`;
    case 'greeting':    return `font-family:${ff};font-size:11pt;line-height:1.9;text-indent:2em;margin:4px 0 8px;color:${C};`;
    case 'body':        return `font-family:${ff};font-size:11pt;line-height:1.9;text-indent:2em;margin:6px 0;color:${C};`;
    case 'sig_name':    return `font-family:${ff};font-size:11pt;line-height:1.9;text-indent:0;text-align:right;margin:24px 0 2px;color:${C};`;
    case 'sig_date':    return `font-family:${ff};font-size:11pt;line-height:1.9;text-indent:0;text-align:right;margin:2px 0 6px;color:${C};`;
    case 'ul':          return `margin:8px 0 8px 24px;font-family:${ff};`;
    case 'li':          return `font-family:${ff};font-size:11pt;line-height:1.9;margin:4px 0;color:${C};`;
    case 'strong':      return `font-weight:bold;`;
  }
  return '';
}

/* 判断一段 <p> 在信件中扮演的角色。
   text 是去掉所有 HTML 标签后的纯文本；idx 是该段在所有 <p> 中的序号；total 是 <p> 总数。 */
function _classifyLetterRole(text, idx, total) {
  const t = String(text || '').trim();
  // 称呼：第 0 段，长度短，以冒号结尾，或以特定敬语开头
  if (idx === 0 && t.length <= 30 && (/[：:]$/.test(t) || /^(致|尊敬|亲爱|敬启|敬呈|敬爱)/.test(t))) {
    return 'salutation';
  }
  // 问候：第 1 段，短且匹配"您好/你好"模式
  if (idx === 1 && t.length <= 20 && /^(您好|你好|大家好)/.test(t)) {
    return 'greeting';
  }
  // 落款：最后一段含日期格式
  const hasDate = /\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日/.test(t) || /\d{4}[-/.]\d{1,2}[-/.]\d{1,2}/.test(t);
  if (idx === total - 1 && hasDate) {
    return 'sig_date';
  }
  // 倒数第二段：短且像署名
  if (idx === total - 2 && t.length <= 30 && /(心理老师|心理辅导|心理教师|心理咨询师|学校.{0,8}老师)/.test(t)) {
    return 'sig_name';
  }
  // 最后一段不含日期但像署名+日期混在一段（通过 <br> 分隔）
  if (idx === total - 1 && t.length <= 50 && /(心理老师|心理辅导|心理教师)/.test(t)) {
    return 'sig_date';
  }
  return 'body';
}

/* 给已经渲染好的 HTML body 注入用于 Word/PDF 导出的 inline style。
   - html 是 renderMarkdown 或 contenteditable 输出的 HTML 字符串
   - audience: 'teacher' | 'parent' | 'superior' | 'peer' | undefined
     teacher/parent 走信件模式，其余走通用文档模式 */
function applyExportStyles(html, audience) {
  if (!html) return '';
  const isLetter = audience === 'teacher' || audience === 'parent';
  let out = String(html);

  // h1/h2/h3 用居中标题/小节标题
  out = out
    .replace(/<h1\b[^>]*>/gi, `<h1 style="${_exportStyle('title')}">`)
    .replace(/<h2\b[^>]*>/gi, `<h2 style="${_exportStyle('title')}">`)
    .replace(/<h3\b[^>]*>/gi, `<h3 style="${_exportStyle('subtitle')}">`)
    .replace(/<ul\b[^>]*>/gi, `<ul style="${_exportStyle('ul')}">`)
    .replace(/<li\b[^>]*>/gi, `<li style="${_exportStyle('li')}">`)
    .replace(/<strong\b[^>]*>/gi, `<strong style="${_exportStyle('strong')}">`)
    .replace(/<b\b[^>]*>/gi, `<b style="${_exportStyle('strong')}">`);

  // p 段落处理
  if (isLetter) {
    // 先数一下 p 总数
    const total = (out.match(/<p\b[^>]*>/gi) || []).length;
    let idx = 0;
    out = out.replace(/<p\b[^>]*>([\s\S]*?)<\/p>/gi, (m, inner) => {
      const text = String(inner).replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').trim();
      const role = _classifyLetterRole(text, idx, total);
      idx += 1;
      return `<p style="${_exportStyle(role)}">${inner}</p>`;
    });
  } else {
    out = out.replace(/<p\b[^>]*>/gi, `<p style="${_exportStyle('body')}">`);
  }
  return out;
}

/* 把 contenteditable 区域产生的 HTML 大致还原为 markdown。
   常见标签：p, br, div, span, strong/b, em/i, h2, h3, ul/ol, li
   保留标题(#)、加粗(**)、列表(-)；丢失其他 inline 样式（颜色、字号等）。 */
function htmlToSimpleMarkdown(html) {
  if (!html) return '';
  let text = String(html);
  // 块级标签转换
  text = text
    .replace(/<h1\b[^>]*>([\s\S]*?)<\/h1>/gi, '\n# $1\n\n')
    .replace(/<h2\b[^>]*>([\s\S]*?)<\/h2>/gi, '\n# $1\n\n')
    .replace(/<h3\b[^>]*>([\s\S]*?)<\/h3>/gi, '\n## $1\n\n')
    .replace(/<(?:strong|b)\b[^>]*>([\s\S]*?)<\/(?:strong|b)>/gi, '**$1**')
    .replace(/<(?:em|i)\b[^>]*>([\s\S]*?)<\/(?:em|i)>/gi, '*$1*')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<li\b[^>]*>([\s\S]*?)<\/li>/gi, '- $1\n')
    .replace(/<\/?(?:ul|ol)\b[^>]*>/gi, '\n')
    .replace(/<\/p>\s*<p\b[^>]*>/gi, '\n\n')
    .replace(/<p\b[^>]*>/gi, '')
    .replace(/<\/p>/gi, '\n\n')
    .replace(/<div\b[^>]*>/gi, '')
    .replace(/<\/div>/gi, '\n')
    .replace(/<[^>]+>/g, '');
  // 解码常用实体
  text = text
    .replace(/&nbsp;/g, ' ')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'");
  text = text.replace(/\n{3,}/g, '\n\n').trim();
  return text;
}

/* =============================================================
   Crypto:Web Crypto API 封装
   - SHA-256 哈希(用于密码验证)
   - PBKDF2 派生密钥
   - AES-GCM 对称加密(用于姓名映射表、API key)
   ============================================================= */
const Crypto = {
  enc: new TextEncoder(),
  dec: new TextDecoder(),

  async sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', this.enc.encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  },

  async deriveKey(password, salt) {
    const baseKey = await crypto.subtle.importKey('raw', this.enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  },

  async encrypt(plain, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.deriveKey(password, salt);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, this.enc.encode(plain));
    return { salt: btoa(String.fromCharCode(...salt)), iv: btoa(String.fromCharCode(...iv)), ct: btoa(String.fromCharCode(...new Uint8Array(ct))) };
  },

  async decrypt(payload, password) {
    const salt = Uint8Array.from(atob(payload.salt), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(payload.iv), c => c.charCodeAt(0));
    const ct = Uint8Array.from(atob(payload.ct), c => c.charCodeAt(0));
    const key = await this.deriveKey(password, salt);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return this.dec.decode(plain);
  },

  generateRecoveryCode() {
    // 4组5位字母+数字
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const groups = [];
    for (let i = 0; i < 4; i++) {
      let g = '';
      const bytes = crypto.getRandomValues(new Uint8Array(5));
      for (let j = 0; j < 5; j++) g += chars[bytes[j] % chars.length];
      groups.push(g);
    }
    return groups.join('-');
  }
};

/* =============================================================
   DeepSeek API
   ============================================================= */
const API = {
  endpoint: 'https://api.deepseek.com/chat/completions',
  model: 'deepseek-chat',

  async call(systemPrompt, userContent, apiKey, expectJson = false) {
    if (!apiKey) throw new Error('未设置 DeepSeek API Key,请在设置中配置');
    const body = {
      model: this.model,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userContent }
      ],
      temperature: 0.7,
      stream: false
    };
    if (expectJson) body.response_format = { type: 'json_object' };

    const resp = await fetch(this.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify(body)
    });
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`API 错误 ${resp.status}:${text.slice(0, 200)}`);
    }
    const data = await resp.json();
    const content = data?.choices?.[0]?.message?.content || '';
    if (expectJson) return this.parseJson(content);
    return content;
  },

  parseJson(text) {
    // 容错:去除可能的 ```json fence
    let t = text.trim();
    t = t.replace(/^```(?:json)?\s*/, '').replace(/```\s*$/, '').trim();
    try { return JSON.parse(t); }
    catch (e) {
      throw new Error('AI 返回的 JSON 解析失败:' + e.message);
    }
  }
};

        else if (action === 'backup-export') this.openBackupExportModal();
        else if (action === 'backup-import') this.openBackupImportModal();
      };
    });

    // 备份健康指示器 & 提示横幅
    $('#backup-indicator-wrap').onclick = () => this.openBackupExportModal();
    $('#inline-banner-export').onclick = () => {

      $('#backup-inline-banner').style.display = 'none';

    $('#btn-new-obs').onclick = () => this.openNewObservationModal();
    $('#btn-export-report').onclick = () => this.openExportModal();
  },

  /* ============================================================
     引导页流程
     ============================================================ */
  startOnboarding() {
    this.switchView('onboarding-view');
    this.state.onboardingStep = 1;
    this.renderOnboardingStep();
  },

  renderOnboardingStep() {
    const step = this.state.onboardingStep;
    $$('.onboarding-step-indicator .dot').forEach((d, i) => d.classList.toggle('active', i + 1 === step));

    const c = $('#onboarding-step-content');
    if (step === 1) {
      c.innerHTML = `
        <h2 class="onboarding-title">欢迎使用心理个案工作台</h2>
        <p class="onboarding-subtitle">这是一个为学校心理老师设计的AI辅助个案档案工具。数据全部保存在本机浏览器,原始信息不上传任何服务器。<br><br>整个引导过程约2分钟,接下来会依次设置:主密码、姓名保护密码、紧急恢复码、AI 接入。</p>
        <div class="onboarding-actions">
          <button class="btn btn-ghost" id="ob-demo">先用演示数据看看</button>
          <button class="btn btn-primary" id="ob-next">开始设置</button>
        </div>
      `;
      $('#ob-demo').onclick = () => this.enterDemoMode();
      $('#ob-next').onclick = () => { this.state.onboardingStep = 2; this.renderOnboardingStep(); };
    }
    else if (step === 2) {
      c.innerHTML = `
        <h2 class="onboarding-title">设置主密码</h2>
        <p class="onboarding-subtitle">主密码用于打开工作台。如果忘记,可以使用稍后生成的紧急恢复码恢复访问。</p>
        <div class="input-group"><label>主密码(8位以上)</label><input type="password" id="ob-pwd1" autocomplete="new-password"></div>
        <div class="input-group"><label>再次输入主密码</label><input type="password" id="ob-pwd1c" autocomplete="new-password"></div>
        <div class="onboarding-actions">
          <button class="btn btn-ghost" id="ob-back">← 上一步</button>
          <button class="btn btn-primary" id="ob-next">下一步</button>
        </div>
      `;
      $('#ob-back').onclick = () => { this.state.onboardingStep = 1; this.renderOnboardingStep(); };
      $('#ob-next').onclick = () => {
        const p = $('#ob-pwd1').value, pc = $('#ob-pwd1c').value;
        if (p.length < 8) return showToast('主密码至少 8 位', 'error');
        if (p !== pc) return showToast('两次输入不一致', 'error');
        this.state.onboardingData.masterPassword = p;
        this.state.onboardingStep = 3; this.renderOnboardingStep();
      };
    }
    else if (step === 3) {
      c.innerHTML = `
        <h2 class="onboarding-title">设置姓名保护密码</h2>
        <p class="onboarding-subtitle">这是一道独立于主密码的保险。日常工作时学生姓名仅显示化名,只有输入这个密码才会限时(15分钟)显示真名。<br><br>注意:这个密码一旦丢失无法恢复 —— 紧急恢复码救主密码,不救姓名映射表,以最大程度保护学生隐私。</p>
        <div class="input-group"><label>姓名保护密码(6位以上,建议与主密码不同)</label><input type="password" id="ob-pwd2" autocomplete="new-password"></div>
        <div class="input-group"><label>再次输入</label><input type="password" id="ob-pwd2c" autocomplete="new-password"></div>
        <div class="warning-box">姓名映射表使用此密码独立加密。即使有人拿到主密码,也无法看到真名;但同时,这意味着此密码必须妥善保管。</div>
        <div class="onboarding-actions">
          <button class="btn btn-ghost" id="ob-back">← 上一步</button>
          <button class="btn btn-primary" id="ob-next">下一步</button>
        </div>
      `;
      $('#ob-back').onclick = () => { this.state.onboardingStep = 2; this.renderOnboardingStep(); };
      $('#ob-next').onclick = () => {
        const p = $('#ob-pwd2').value, pc = $('#ob-pwd2c').value;
        if (p.length < 6) return showToast('姓名保护密码至少 6 位', 'error');
        if (p !== pc) return showToast('两次输入不一致', 'error');
        this.state.onboardingData.namePassword = p;
        this.state.onboardingStep = 4; this.renderOnboardingStep();
      };
    }
    else if (step === 4) {
      const code = Crypto.generateRecoveryCode();
      this.state.onboardingData.recoveryCode = code;
      c.innerHTML = `
        <h2 class="onboarding-title">紧急恢复码</h2>
        <p class="onboarding-subtitle">如果你忘记了主密码,可以用这个恢复码重新设置主密码。<strong>请立即截图、抄写或拍照保存。</strong>这个恢复码不会再次出现。</p>
        <div class="recovery-code-display">${code}</div>
        <div class="warning-box">恢复码只能恢复对工作台的访问,不会恢复姓名保护密码加密的姓名映射表。这是双层独立保险,故意如此设计。</div>
        <div class="input-group" style="margin-top:18px;">
          <label><input type="checkbox" id="ob-ack" style="width:auto;margin-right:6px;">我已经妥善保存了恢复码</label>
        </div>
        <div class="onboarding-actions">
          <button class="btn btn-ghost" id="ob-back">← 上一步</button>
          <button class="btn btn-primary" id="ob-next">下一步</button>
        </div>
      `;
      $('#ob-back').onclick = () => { this.state.onboardingStep = 3; this.renderOnboardingStep(); };
      $('#ob-next').onclick = () => {
        if (!$('#ob-ack').checked) return showToast('请确认已保存恢复码', 'error');
        this.state.onboardingStep = 5; this.renderOnboardingStep();
      };
    }
    else if (step === 5) {
      c.innerHTML = `
        <h2 class="onboarding-title">配置 AI 接入(可选)</h2>
        <p class="onboarding-subtitle">本工具调用 DeepSeek 大模型完成白描翻译与受众导出。如果你现在没有 API Key 也可以跳过,后续使用 AI 功能时再设置。<br><br>API Key 会用主密码加密后保存在本机,不会上传任何服务器。</p>
        <div class="input-group">
          <label>DeepSeek API Key(可选)</label>
          <input type="text" id="ob-api" placeholder="sk-..." autocomplete="off">
          <div class="hint">前往 platform.deepseek.com 申请。也可以稍后在工具内设置。</div>
        </div>
        <div class="onboarding-actions">
          <button class="btn btn-ghost" id="ob-back">← 上一步</button>
          <button class="btn btn-primary" id="ob-finish">完成设置 并 进入工作台</button>
        </div>
      `;
      $('#ob-back').onclick = () => { this.state.onboardingStep = 4; this.renderOnboardingStep(); };
      $('#ob-finish').onclick = () => this.finalizeOnboarding();
    }
  },

  async finalizeOnboarding() {
    try {
      const od = this.state.onboardingData;
      const masterHash = await Crypto.sha256(od.masterPassword);
      const nameHash = await Crypto.sha256(od.namePassword);
      const recoveryHash = await Crypto.sha256(od.recoveryCode);
      // 用恢复码加密一份主密码备份(用于恢复码恢复访问)
      const masterBackup = await Crypto.encrypt(od.masterPassword, od.recoveryCode);

      const config = {
        master_password_hash: masterHash,
        name_protection_password_hash: nameHash,
        recovery_code_hash: recoveryHash,
        master_password_backup: masterBackup,
        setup_complete: true,
        created_at: new Date().toISOString()
      };
      Store.setConfig(config);
      // 初始化空 nameMap
      const emptyMapEnc = await Crypto.encrypt(JSON.stringify({}), od.namePassword);
      Store.setNameMapEnc(emptyMapEnc);

      // 可选的 API key
      const apiKey = $('#ob-api').value.trim();
      if (apiKey) {
        const enc = await Crypto.encrypt(apiKey, od.masterPassword);
        Store.setApiKeyEnc(enc);
      }
      Store.setStudents(EXAMPLE_STUDENTS);

      this.state.config = config;
      this.state.masterPassword = od.masterPassword;
      this.state.nameProtectionPassword = od.namePassword;
      this.state.apiKey = apiKey || null;
      this.state.nameMap = {};
      this.state.students = JSON.parse(JSON.stringify(EXAMPLE_STUDENTS));

      this.enterMain();
      showToast('设置完成,欢迎使用', 'success');
    } catch (e) {
      console.error(e);
      showToast('设置出错:' + e.message, 'error');
    }
  },

  enterDemoMode() {
    this.state.students = JSON.parse(JSON.stringify(DEMO_DATA.students));
    this.state.nameMap = {};
    DEMO_DATA.students.forEach(s => { this.state.nameMap[s.id] = s.real_name; });
    this.state.config = { setup_complete: false, demo_mode: true };
    this.state.masterPassword = 'demo';
    this.state.nameProtectionPassword = 'demo';
    this.enterMain();
    showToast('已进入演示模式 · 数据不会保存', 'success');
  },

  /* ============================================================
     登录
     ============================================================ */
  async handleLogin() {
    const pwd = $('#login-password').value;
    if (!pwd) return;
    const hash = await Crypto.sha256(pwd);
    if (hash !== this.state.config.master_password_hash) {
      showToast('主密码错误', 'error');
      return;
    }
    this.state.masterPassword = pwd;

    // 尝试解密 API key
    const apiEnc = Store.getApiKeyEnc();
    if (apiEnc) {
      try { this.state.apiKey = await Crypto.decrypt(apiEnc, pwd); } catch (e) {}
    }

    this.state.students = Store.getStudents();
    this.state.nameMap = {};   // 真名映射默认锁定
    this.enterMain();
  },

  enterMain() {
    this.switchView('main-view');
    this.renderSidebar();
    this.switchMode('overview');
    this.updateNameIndicator();
    this.updateBackupHealth();
    // 延迟检查横幅,避免遮挡登录过渡
    setTimeout(() => this.checkBackupBanner(), 1200);
  },

  lockApp() {
    if (confirm('确定要锁定工作台吗?\n下次进入需要重新输入主密码。')) {
      this.state.masterPassword = null;
      this.state.nameProtectionPassword = null;
      this.state.apiKey = null;
      this.state.nameMap = {};
      this.state.nameUnlockUntil = 0;
      this.switchView('login-view');
      $('#login-password').value = '';
      setTimeout(() => $('#login-password').focus(), 100);
    }
  },

  openRecoveryModal() {
    const html = `
      <div class="modal modal-unlock">
        <div class="modal-header">
          <span class="modal-title">使用紧急恢复码</span>
          <span class="modal-close" data-close>×</span>
        </div>
        <div class="modal-body">
          <p style="font-size:13px;color:var(--color-text-sub);line-height:1.7;margin-bottom:14px;">输入紧急恢复码,通过验证后可重新设置主密码。<strong>姓名映射表不会被恢复</strong>(双层独立保险)。</p>
          <div class="input-group"><label>紧急恢复码</label><input type="text" id="rec-code" placeholder="XXXXX-XXXXX-XXXXX-XXXXX"></div>
          <div class="input-group"><label>新主密码</label><input type="password" id="rec-newpwd"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" data-close>取消</button>
          <button class="btn btn-primary" id="rec-confirm">恢复</button>
        </div>
      </div>
    `;
    this.openModal(html);
    $('#rec-confirm').onclick = async () => {
      const code = $('#rec-code').value.trim().toUpperCase();
      const newPwd = $('#rec-newpwd').value;
      if (newPwd.length < 8) return showToast('新密码至少 8 位', 'error');
      const hash = await Crypto.sha256(code);
      if (hash !== this.state.config.recovery_code_hash) return showToast('恢复码不正确', 'error');
      // 更新主密码哈希
      this.state.config.master_password_hash = await Crypto.sha256(newPwd);
      this.state.config.master_password_backup = await Crypto.encrypt(newPwd, code);
      Store.setConfig(this.state.config);
      this.closeModal();
      showToast('主密码已重置,请用新密码登录', 'success');
    };
  },

  handleNameIndicatorClick() {
    if (this.isNameUnlocked()) {
      this.state.nameUnlockUntil = 0;
      this.updateNameIndicator();
      this.renderSidebar();
      if (this.state.currentStudentId) this.renderCaseHeader();
      showToast('已锁回化名模式');
    } else {
      this.openUnlockNameModal();
    }
  },

  openUnlockNameModal() {
    const html = `
      <div class="modal modal-unlock">
        <div class="modal-header">
          <span class="modal-title">解锁真名(15分钟)</span>
          <span class="modal-close" data-close>×</span>
        </div>
        <div class="modal-body">
          <p style="font-size:13px;color:var(--color-text-sub);line-height:1.7;margin-bottom:14px;">输入姓名保护密码后,15 分钟内可看到真名。到期自动锁回。</p>
          <div class="input-group"><label>姓名保护密码</label><input type="password" id="unlock-pwd" autofocus></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" data-close>取消</button>
          <button class="btn btn-primary" id="unlock-confirm">解锁</button>
        </div>
      </div>
    `;
    this.openModal(html);
    setTimeout(() => $('#unlock-pwd').focus(), 50);
    const submit = async () => {
      const p = $('#unlock-pwd').value;
      const hash = await Crypto.sha256(p);
      if (this.state.config.demo_mode) {
        // 演示模式直接放行
        this.state.nameProtectionPassword = p;
      } else {
        if (hash !== this.state.config.name_protection_password_hash) return showToast('密码错误', 'error');
        // 解密 nameMap
        const enc = Store.getNameMapEnc();
        if (enc) {
          try { this.state.nameMap = JSON.parse(await Crypto.decrypt(enc, p)); }
          catch (e) { return showToast('映射表解密失败', 'error'); }
        }
        this.state.nameProtectionPassword = p;
      }
      this.state.nameUnlockUntil = Date.now() + 15 * 60 * 1000;
      this.closeModal();
      this.updateNameIndicator();
      this.renderSidebar();
      if (this.state.currentStudentId) this.renderCaseHeader();
      if (App._pendingRealNameField) {
        const pf = App._pendingRealNameField;
        this.setupRealNameField(pf.wrapEl, pf.inputId);
        App._pendingRealNameField = null;
      }
      showToast('已解锁真名,15 分钟后自动锁回', 'success');
    };
    $('#unlock-confirm').onclick = submit;
    $('#unlock-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  },

  /* ============================================================
     侧边栏渲染
     ============================================================ */
  renderSidebar() {
    const list = $('#student-list');
    const students = this.state.students;
    $('#student-count').textContent = students.length;

    // 按风险等级分组(取每个学生最新观察的 risk_level)
    const groups = { '需转介': [], '重点关注': [], '一般关注': [], '未评估': [] };
    students.forEach(s => {
      const obs = s.observations || [];
      const latest = obs[obs.length - 1];
      const risk = latest?.teacher_final?.tags?.risk_level || '未评估';
      (groups[risk] || groups['未评估']).push(s);
    });

    let html = '';
    const renderGroup = (label, arr, dotClass) => {
      if (!arr.length) return '';
      let g = `<div class="list-group"><div class="list-group-header"><span class="level-dot ${dotClass}"></span>${label} · ${arr.length}</div>`;
      arr.forEach(s => {
        const initial = (this.displayName(s) || '·').slice(-1);
        const latest = (s.observations || [])[s.observations.length - 1];
        const lastDate = latest ? formatDate(latest.date) : '—';
        const active = s.id === this.state.currentStudentId ? 'active' : '';
        g += `<div class="student-item ${active}" data-id="${s.id}">
          <div class="avatar">${escapeHtml(initial)}</div>
          <div class="info">
            <div class="name">${escapeHtml(this.displayName(s))}</div>
            <div class="meta">${escapeHtml(s.basic_info?.class || '')}</div>
          </div>
          <div class="last-update">${lastDate}</div>
          <button class="student-del-btn" data-del-id="${s.id}" title="删除此档案" aria-label="删除">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>`;
      });
      g += '</div>';
      return g;
    };
    html += renderGroup('需转介', groups['需转介'], 'l3');
    html += renderGroup('重点关注', groups['重点关注'], 'l2');
    html += renderGroup('一般关注', groups['一般关注'], 'l1');
    html += renderGroup('未评估', groups['未评估'], 'l1');

    if (!html) {
      html = `<div class="empty-state" style="padding:30px 16px;">还没有个案,点击右上角 + 新建</div>`;
    }
    list.innerHTML = html;
    $$('.student-item', list).forEach(el => {
      el.onclick = () => this.openCase(el.dataset.id);
    });
    $$('.student-del-btn', list).forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        this.openDeleteStudentModal(el.dataset.delId);
      };
    });
  },

  /* ============================================================
     总览模式渲染
     ============================================================ */
  renderOverview() {
    const students = this.state.students;
    // 统计
    const now = Date.now();
    const WEEK = 7 * 24 * 3600 * 1000;
    const MONTH = 30 * 24 * 3600 * 1000;
    let alert = 0, followup = 0, week = 0, closed = 0;
    students.forEach(s => {
      const obs = s.observations || [];
      const latest = obs[obs.length - 1];
      const risk = latest?.teacher_final?.tags?.risk_level;
      if (risk === '重点关注' || risk === '需转介') alert++;
      if (latest && now - new Date(latest.date).getTime() > MONTH) followup++;
      if (latest && now - new Date(latest.date).getTime() < WEEK) week++;
    });
    $('#stat-active').textContent = students.length;
    $('#stat-alert').textContent = alert;
    $('#stat-followup').textContent = followup;
    $('#stat-week').textContent = week;
    $('#stat-closed').textContent = closed;

    // 风险等级环形图
    const riskCounts = { '一般关注': 0, '重点关注': 0, '需转介': 0 };
    students.forEach(s => {
      const latest = (s.observations || [])[s.observations.length - 1];
      const r = latest?.teacher_final?.tags?.risk_level;
      if (r && riskCounts.hasOwnProperty(r)) riskCounts[r]++;
    });
    this.renderRiskChart(riskCounts);

    // 行为类别横向条形图
    const catCounts = { '学业评价压力': 0, '情绪失控': 0, '家庭沟通': 0, '同伴关系': 0, '进食睡眠': 0, '其他': 0 };
    students.forEach(s => {
      (s.observations || []).forEach(o => {
        (o.teacher_final?.tags?.behavior_categories || []).forEach(c => {
          if (catCounts.hasOwnProperty(c)) catCounts[c]++;
        });
      });
    });
    this.renderCategoryChart(catCounts);

    // 今日待办
    this.renderTodos();
  },

  renderRiskChart(counts) {
    const dom = $('#chart-risk');
    if (!dom._chart) dom._chart = echarts.init(dom, null, { renderer: 'svg' });
    const total = counts['一般关注'] + counts['重点关注'] + counts['需转介'];
    dom._chart.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: {c} 人 ({d}%)' },
      legend: { bottom: 0, icon: 'circle', textStyle: { fontSize: 12, color: '#5F6B72' } },
      color: ['#7BA6B5', '#BA7517', '#993C1D'],
      series: [{
        type: 'pie',
        radius: ['52%', '78%'],
        center: ['50%', '46%'],
        avoidLabelOverlap: false,
        label: {
          show: true, position: 'center',
          formatter: () => `{a|${total}}\n{b|在跟进}`,
          rich: {
            a: { fontSize: 30, fontWeight: 600, color: '#1A2A33', fontFamily: 'ui-monospace, monospace' },
            b: { fontSize: 12, color: '#8A9499', padding: [6,0,0,0] }
          }
        },
        labelLine: { show: false },
        itemStyle: { borderColor: '#fff', borderWidth: 2 },
        data: [
          { value: counts['一般关注'], name: '一般关注' },
          { value: counts['重点关注'], name: '重点关注' },
          { value: counts['需转介'], name: '需转介' }
        ]
      }]
    });
  },

  renderCategoryChart(counts) {
    const dom = $('#chart-category');
    if (!dom._chart) dom._chart = echarts.init(dom, null, { renderer: 'svg' });
    const cats = Object.keys(counts);
    const values = cats.map(c => counts[c]);
    dom._chart.setOption({
      grid: { left: 80, right: 20, top: 10, bottom: 20 },
      xAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: 'rgba(20,50,70,0.05)' } }, axisLabel: { color: '#8A9499', fontSize: 11 } },
      yAxis: { type: 'category', data: cats, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#5F6B72', fontSize: 12 } },
      tooltip: { trigger: 'axis' },
      series: [{
        type: 'bar',
        data: values,
        barWidth: 16,
        itemStyle: {
          color: '#7A5BB8',
          borderRadius: [0, 3, 3, 0]
        },
        label: { show: true, position: 'right', color: '#5F6B72', fontSize: 11, fontFamily: 'ui-monospace, monospace' }
      }]
    });
  },

  renderTodos() {
    const list = $('#todo-list');
    const todos = [];
    const now = Date.now();
    const MONTH = 30 * 24 * 3600 * 1000;
    this.state.students.forEach(s => {
      const latest = (s.observations || [])[s.observations.length - 1];
      if (!latest) return;
      const risk = latest.teacher_final?.tags?.risk_level;
      const gap = now - new Date(latest.date).getTime();
      if (gap > MONTH) {
        todos.push({ priority: risk === '需转介' ? 'high' : 'mid', text: `${this.displayName(s)} 已 ${Math.floor(gap/86400000)} 天未跟进`, meta: s.basic_info?.class || '', id: s.id });
      }
      if (risk === '需转介') {
        todos.push({ priority: 'high', text: `${this.displayName(s)} 风险等级为「需转介」,建议本周内推进转介流程`, meta: latest.teacher_final?.tags?.risk_level || '', id: s.id });
      }
    });
    if (!todos.length) {
      list.innerHTML = '<div class="empty-state" style="padding:24px 0;">暂无紧急待办</div>';
      $('#todo-card-meta').textContent = '';
      return;
    }
    todos.sort((a,b) => (a.priority === 'high' ? -1 : 1));
    $('#todo-card-meta').textContent = `${todos.length} 项`;
    list.innerHTML = todos.slice(0, 8).map(t => `
      <div class="todo-item priority-${t.priority}">
        <div class="text">${escapeHtml(t.text)}<div class="meta">${escapeHtml(t.meta)}</div></div>
        <div class="action"><button class="btn btn-ghost" onclick="App.openCase('${t.id}')">查看 →</button></div>
      </div>
    `).join('');
  },

    this.renderSidebar();
    this.renderBreadcrumb();

        </div>

          ${s.family_background?.events ? `<div><span class="dl-label">家庭事件:</span>${escapeHtml(s.family_background.events)}</div>` : ''}
          ${s.initial_assessment ? `<div><span class="dl-label">初始评估:</span>${escapeHtml(s.initial_assessment)}</div>` : ''}

  renderCaseCharts() {
    const s = this.state.students.find(x => x.id === this.state.currentStudentId);
    if (!s) return;
    const obs = (s.observations || []).filter(o => o.confirmed);
    // 情绪强度折线
    const dom1 = $('#chart-emotion');
    if (!dom1._chart) dom1._chart = echarts.init(dom1, null, { renderer: 'svg' });
    const dates = obs.map(o => formatDate(o.date));
    const vals = obs.map(o => o.teacher_final?.tags?.emotion_intensity || null);
    const highlightIdx = vals.length - 1;
    dom1._chart.setOption({
      grid: { left: 36, right: 18, top: 22, bottom: 30 },
      xAxis: { type: 'category', data: dates, axisLine: { lineStyle: { color: 'rgba(20,50,70,0.1)' } }, axisLabel: { color: '#8A9499', fontSize: 11 } },
      yAxis: { type: 'value', min: 1, max: 5, interval: 1, axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: 'rgba(20,50,70,0.05)' } }, axisLabel: { color: '#8A9499', fontSize: 11 } },
      tooltip: { trigger: 'axis' },
      series: [{
        type: 'line', data: vals, smooth: 0.35,
        symbol: 'circle', symbolSize: 9,
        lineStyle: { color: '#5A8898', width: 2 },
        itemStyle: { color: '#5A8898' },
        markPoint: highlightIdx >= 0 ? {
          symbol: 'circle', symbolSize: 13,
          itemStyle: { color: '#BA7517', borderColor: '#fff', borderWidth: 2 },
          label: { show: false },
          data: [{ coord: [highlightIdx, vals[highlightIdx]] }]
        } : undefined,
        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(90,136,152,0.15)' }, { offset: 1, color: 'rgba(90,136,152,0)' }] } }
      }]
    });

    // 行为类别小型环形
    const dom2 = $('#chart-case-category');
    if (!dom2._chart) dom2._chart = echarts.init(dom2, null, { renderer: 'svg' });
    const catCount = {};
    obs.forEach(o => (o.teacher_final?.tags?.behavior_categories || []).forEach(c => { catCount[c] = (catCount[c] || 0) + 1; }));
    const catData = Object.keys(catCount).map(k => ({ name: k, value: catCount[k] }));
    if (!catData.length) catData.push({ name: '尚无数据', value: 1 });
    dom2._chart.setOption({
      tooltip: { trigger: 'item' },
      legend: { bottom: 0, icon: 'circle', textStyle: { fontSize: 11, color: '#5F6B72' } },
      color: ['#7A5BB8', '#5A8898', '#BA7517', '#7BA6B5', '#993C1D', '#8A9499'],
      series: [{
        type: 'pie', radius: ['46%', '72%'], center: ['50%', '46%'],
        avoidLabelOverlap: false,
        label: { show: false },
        labelLine: { show: false },
        itemStyle: { borderColor: '#fff', borderWidth: 2 },
        data: catData
      }]
    });
  },

  /* ============================================================
     AI 翻译
     ============================================================ */
  async handleAITranslate() {
    const raw = $('#obs-modal-raw').value.trim();
    if (!raw) return showToast('请先录入观察内容', 'error');
    // 演示模式不需要 API 密钥
    if (!this.state.config.demo_mode && !this.state.apiKey) {
      return this.openApiSetupModal();
    }
    const btn = $('#btn-ai-translate');
    btn.disabled = true;
    btn.innerHTML = `<span class="loading-spinner"></span> AI 正在整理...`;
    try {
      const s = this.state.students.find(x => x.id === this.state.currentStudentId);
      // 脱敏:真名→化名(此处实际白描默认就是用化名输入,但兼容)
      let userContent = raw;
      if (s && this.state.nameMap[s.id]) {
        userContent = raw.split(this.state.nameMap[s.id]).join(s.alias);
      }
      const result = this.state.config.demo_mode
        ? await this.mockTranslateNarrative(userContent)
        : await API.call(PROMPTS.narrative, userContent, this.state.apiKey, true);
      this.state.pendingNarrative = result.narrative;
      this.state.pendingTags = result.tags;
      this.state.pendingRawText = raw;
      this.renderAIOutput(result);
    } catch (e) {
      console.error(e);
      showToast('AI 翻译失败:' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg> AI 翻译为专业档案`;
    }
  },

  renderAIOutput(result) {
    const segs = $('#narrative-segments');
    const segLabels = [
      { key: 'behavior', label: '行为表现' },
      { key: 'emotion_cognition', label: '情绪与认知' },
      { key: 'possible_causes', label: '可能成因' },
      { key: 'intervention_suggestions', label: '干预建议' }
    ];
    const demoBanner = this.state.config?.demo_mode ? `
      <div class="demo-mode-warning">
        <span class="dmw-icon">📌</span>
        <span class="dmw-text"><strong>演示模式 · 模板示范</strong>这是预设的模板内容,根据关键词从 5 段示范中选择,并非针对您输入的白描真实生成。正式模式下接入 DeepSeek 后,AI 会根据您的实际观察记录撰写专业判断。</span>
      </div>` : '';
    segs.innerHTML = demoBanner + segLabels.map(s => `
      <div class="segment-block editable">
        <div class="seg-label">${s.label}</div>
        <div class="seg-content" contenteditable="true" data-key="${s.key}">${escapeHtml(result.narrative[s.key] || '')}</div>
      </div>
    `).join('');

    const tags = $('#tags-row');
    const cats = ['学业评价压力', '情绪失控', '家庭沟通', '同伴关系', '进食睡眠', '其他'];
    const selectedCats = result.tags.behavior_categories || [];
    tags.innerHTML = `
      <div class="tag-control">
        <span class="tag-label">行为类别(多选,可点击切换)</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${cats.map(c => `<span class="tag-value cat-toggle" data-cat="${c}" data-on="${selectedCats.includes(c) ? '1' : '0'}" style="${selectedCats.includes(c) ? 'background:rgba(122,91,184,0.14);color:#7A5BB8;border-color:#7A5BB8;' : ''}">${c}</span>`).join('')}
        </div>
      </div>
      <div class="tag-control">
        <span class="tag-label">情绪强度</span>
        <select class="tag-value" data-key="emotion_intensity">
          ${[1,2,3,4,5].map(n => `<option value="${n}" ${n===result.tags.emotion_intensity?'selected':''}>${n}</option>`).join('')}
        </select>
      </div>
      <div class="tag-control">
        <span class="tag-label">风险等级</span>
        <select class="tag-value" data-key="risk_level">
          ${['一般关注','重点关注','需转介'].map(r => `<option ${r===result.tags.risk_level?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>
      <div class="tag-control">
        <span class="tag-label">需要家校沟通</span>
        <select class="tag-value" data-key="need_family_school_communication">
          <option value="true" ${result.tags.need_family_school_communication?'selected':''}>是</option>
          <option value="false" ${!result.tags.need_family_school_communication?'selected':''}>否</option>
        </select>
      </div>
    `;
    // 类别切换
    $$('.cat-toggle', tags).forEach(el => {
      el.onclick = () => {
        const on = el.dataset.on === '1';
        el.dataset.on = on ? '0' : '1';
        el.style.cssText = !on ? 'background:rgba(122,91,184,0.14);color:#7A5BB8;border-color:#7A5BB8;' : '';
      };
    });
    $('#ai-output-card').style.display = 'block';
  },

  collectFinal() {
    const segs = {};
    $$('#obs-modal-narrative .seg-content').forEach(el => {
      segs[el.dataset.key] = el.innerText.trim();
    });
    const cats = $$('#obs-modal-tags .cat-toggle').filter(el => el.dataset.on === '1').map(el => el.dataset.cat);
    const intensity = parseInt($('#obs-modal-tags select[data-key="emotion_intensity"]').value);
    const risk = $('#obs-modal-tags select[data-key="risk_level"]').value;
    const need = $('#obs-modal-tags select[data-key="need_family_school_communication"]').value === 'true';
    return {
      narrative: segs,
      tags: {
        behavior_categories: cats,
        emotion_intensity: intensity,
        risk_level: risk,
        need_family_school_communication: need
      }
    };
  },

  async handleConfirmSave() {
    if (!this.state.pendingNarrative) return;
    const final = this.collectFinal();
    const s = this.state.students.find(x => x.id === this.state.currentStudentId);
    if (!s) return;
    const obs = {
      id: uid('obs'),
      date: new Date().toISOString(),
      raw_text: this.state.pendingRawText,
      ai_original: { narrative: this.state.pendingNarrative, tags: this.state.pendingTags },
      teacher_final: final,
      confirmed: true
    };
    s.observations = s.observations || [];
    s.observations.push(obs);
    if (!this.state.config.demo_mode) Store.setStudents(this.state.students);
    this.state.pendingNarrative = null;
    this.state.pendingTags = null;
    this.state.pendingRawText = '';
    $('#obs-modal-raw').value = '';
    $('#obs-modal-count').textContent = '0 字';
    $('#obs-modal-output').style.display = 'none';
    this.closeModal();
    this.renderSidebar();
    this.renderCaseHeader();
    this.renderCaseCharts();
    this.renderCaseTimeline();
    this.markBackupDirty('new-observation');
    showToast('已保存到档案 · AI 原始判断与你的修改一并归档', 'success');
  },

  renderCaseTimeline() {
    const s = this.state.students.find(x => x.id === this.state.currentStudentId);
    if (!s) return;
    const obs = (s.observations || []).filter(o => o.confirmed);
    const panel = $('#obs-timeline');
    if (!obs.length) { panel.innerHTML = '<div class="empty-state" style="padding:16px;font-size:13px;">暂无已确认的观察记录 · 点击下方「+ 新建本次观察」开始录入</div>'; return; }
    const rev = obs.slice().reverse();
    const riskColors = { '一般关注': 'badge-l1', '重点关注': 'badge-l2', '需转介': 'badge-l3' };
    panel.innerHTML = rev.map((o, i) => {
      const tf = o.teacher_final || {}, n = tf.narrative || {}, t = tf.tags || {};
      const risk = t.risk_level || '未评估';
      const catBadges = (t.behavior_categories || []).map(c => `<span class="badge badge-category">${escapeHtml(c)}</span>`).join('');
      return `
      <div class="obs-card">
        <div class="obs-header">
          <span class="obs-date">${formatDateTime(o.date)}</span>
          <span class="badge ${riskColors[risk] || 'badge-neutral'}">${escapeHtml(risk)}</span>
          <span class="mono" style="font-size:11px;color:var(--color-text-muted);">强度 ${t.emotion_intensity || '—'}/5</span>
          ${catBadges}
          ${t.need_family_school_communication ? '<span class="badge" style="background:rgba(186,117,23,0.12);color:#BA7517;">需家校沟通</span>' : ''}
          <button class="btn btn-ghost obs-edit-btn" data-obs-id="${o.id}" style="margin-left:auto;font-size:12px;">编辑</button>
        </div>
        <div class="obs-raw">${escapeHtml(o.raw_text)}</div>
        ${n.behavior ? `
        <div class="obs-narrative">
          <div class="ns-item"><span class="ns-label">行为表现</span><br>${escapeHtml(n.behavior)}</div>
          <div class="ns-item"><span class="ns-label">情绪与认知</span><br>${escapeHtml(n.emotion_cognition || '—')}</div>
          <div class="ns-item"><span class="ns-label">可能成因</span><br>${escapeHtml(n.possible_causes || '—')}</div>
          <div class="ns-item"><span class="ns-label">干预建议</span><br>${escapeHtml(n.intervention_suggestions || '—')}</div>
        </div>` : '<div style="font-size:12px;color:var(--color-text-muted);padding:8px 0;">尚未完成 AI 翻译</div>'}
        ${o.ai_original ? '<div style="font-size:10.5px;color:var(--color-text-muted);margin-top:4px;">已保留 AI 原始判断</div>' : ''}
      </div>`;
    }).join('');
    $$('.obs-edit-btn', panel).forEach(btn => { btn.onclick = () => this.openEditObservationModal(btn.dataset.obsId); });
  },

  async saveNewStudent() {
    const alias = $('#ns-alias').value.trim();
    if (!alias) return showToast('化名是必填项', 'error');
    const realEl = $('#ns-real');
    const real = realEl ? realEl.value.trim() : '';
    const id = uid('student');
    const s = {
      id, alias,
      basic_info: { class: $('#ns-class').value.trim(), gender: $('#ns-gender').value, age: null, referral_source: '' },
      family_background: { structure: '', primary_caregiver: '', events: '' },
      initial_assessment: '',
      observations: [],
      current_assessment: ''
    };
    this.state.students.push(s);
    if (real && !this.state.config.demo_mode) {
      this.state.nameMap[id] = real;
      const enc = await Crypto.encrypt(JSON.stringify(this.state.nameMap), this.state.nameProtectionPassword);
      Store.setNameMapEnc(enc);
    } else if (real && this.state.config.demo_mode) { this.state.nameMap[id] = real; }
    if (!this.state.config.demo_mode) Store.setStudents(this.state.students);
    this.closeModal();
    this.renderSidebar();
    this.openCase(id);
    this.markBackupDirty('new-student');
    showToast('档案已建立', 'success');
  },

  async saveEditProfile() {
    const s = this.state.students.find(x => x.id === this.state.currentStudentId);
    if (!s) return;
    const alias = $('#ep-alias').value.trim();
    if (!alias) return showToast('化名是必填项', 'error');
    s.alias = alias;
    s.basic_info = { class: $('#ep-class').value.trim(), gender: $('#ep-gender').value, age: parseInt($('#ep-age').value) || null, referral_source: $('#ep-referral').value.trim() };
    s.family_background = { structure: $('#ep-fam-struct').value.trim(), primary_caregiver: $('#ep-caregiver').value.trim(), events: $('#ep-fam-events').value.trim() };
    s.initial_assessment = $('#ep-initial').value.trim();
    s.current_assessment = $('#ep-current').value.trim();
    const realEl = $('#ep-real');
    const real = realEl ? realEl.value.trim() : '';
    if (real && !this.state.config.demo_mode) {
      this.state.nameMap[s.id] = real;
      const enc = await Crypto.encrypt(JSON.stringify(this.state.nameMap), this.state.nameProtectionPassword);
      Store.setNameMapEnc(enc);
    }
    if (!this.state.config.demo_mode) Store.setStudents(this.state.students);
    this.closeModal();
    this.renderSidebar();
    this.renderCaseHeader();
    showToast('档案已更新', 'success');

  openNewObservationModal() {

        </div>

      if (!ta.value.trim()) return showToast('请先录入观察内容', 'error');

      const btn = $('#btn-obs-translate');

      try {
        const s = this.state.students.find(x => x.id === this.state.currentStudentId);
        let userContent = ta.value;
        if (s && this.state.nameMap[s.id]) userContent = ta.value.split(this.state.nameMap[s.id]).join(s.alias);
        const result = this.state.config.demo_mode
          ? await this.mockTranslateNarrative(userContent)
          : await API.call(PROMPTS.narrative, userContent, this.state.apiKey, true);
        this.state.pendingNarrative = result.narrative;
        this.state.pendingTags = result.tags;
        this.state.pendingRawText = ta.value;
        this.renderObsModalOutput(result);
      } catch (e) { console.error(e); showToast('AI 翻译失败:' + e.message, 'error'); }

  async startExport(audience) {
    const s = this.state.students.find(x => x.id === this.state.currentStudentId);
    if (!s) return;
    // 演示模式不需要 API 密钥(走 mock 模板)
    if (!this.state.config.demo_mode && !this.state.apiKey) {
      this.closeModal();
      return this.openApiSetupModal();
    }
    // 准备脱敏档案 JSON
    const profileJson = JSON.stringify({
      alias: s.alias,
      basic_info: s.basic_info,
      family_background: s.family_background,
      initial_assessment: s.initial_assessment,
      observations: (s.observations || []).filter(o => o.confirmed).map(o => ({
        date: formatDate(o.date),
        raw_text: o.raw_text,
        teacher_final: o.teacher_final
      })),
      current_assessment: s.current_assessment
    }, null, 2);

    this.closeModal();
    this.openExportPreviewModal(audience, '<div class="empty-state"><div class="loading-spinner"></div><div style="margin-top:10px;">AI 正在撰写...</div></div>');

    try {
      const isPeer = audience === 'peer';
      let result;
      if (this.state.config.demo_mode) {
        // 演示模式:走 mock,1.5-2s 模拟生成
        await new Promise(r => setTimeout(r, 1500 + Math.random() * 500));
        result = this.mockExportContent(audience, s);
      } else {
        result = await API.call(PROMPTS[audience], profileJson, this.state.apiKey, isPeer);
      }
      this.renderExportPreview(audience, result, s);
    } catch (e) {
      console.error(e);
      this.renderExportError(e.message);
    }
  },
